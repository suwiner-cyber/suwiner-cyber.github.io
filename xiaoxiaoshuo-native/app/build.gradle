plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xiaoxiaoshuo.reader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xiaoxiaoshuo.reader'
        minSdk 23
        targetSdk 29
        versionCode 10001
        versionName '10.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

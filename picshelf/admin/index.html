<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>图架 PicShelf · 管理后台</title>
<style>
:root{--bg:#f3f6fb;--panel:#fff;--text:#152033;--muted:#718096;--line:#e8edf4;--nav:#0d1729;--nav2:#14223a;--teal:#16c7b1;--blue:#2f80ed;--danger:#dc2626;--shadow:0 18px 60px rgba(15,23,42,.08);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% -10%,rgba(47,128,237,.12),transparent 32%),radial-gradient(circle at 10% 5%,rgba(22,199,177,.10),transparent 28%),var(--bg);min-height:100vh}button,input{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:28px}.login-card{width:min(1040px,96vw);min-height:610px;background:rgba(255,255,255,.94);border:1px solid rgba(232,237,244,.9);border-radius:30px;box-shadow:0 40px 110px rgba(15,23,42,.13);overflow:hidden;display:grid;grid-template-columns:1.08fr .92fr;backdrop-filter:blur(18px)}.login-hero{padding:58px;background:linear-gradient(145deg,#0d1729,#14233c 58%,#183557);color:white;position:relative;overflow:hidden}.login-hero:before,.login-hero:after{content:"";position:absolute;border-radius:999px;filter:blur(1px)}.login-hero:before{width:360px;height:360px;background:rgba(22,199,177,.16);right:-130px;top:-120px}.login-hero:after{width:280px;height:280px;background:rgba(47,128,237,.18);left:-120px;bottom:-100px}.brand{display:flex;gap:15px;align-items:center;position:relative;z-index:1}.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(145deg,#20d8bd,#2f80ed);display:grid;place-items:center;box-shadow:0 16px 36px rgba(47,128,237,.25)}.logo svg{width:34px;height:34px}.brand b{font-size:24px;letter-spacing:.2px}.brand small{display:block;color:#93c5fd;font-size:11px;letter-spacing:2.6px;margin-top:4px}.hero-copy{position:relative;z-index:1;margin-top:95px;max-width:470px}.hero-copy h1{font-size:44px;line-height:1.15;margin:0 0 18px;letter-spacing:-1px}.hero-copy p{color:#c8d5e6;font-size:15px;line-height:1.9;margin:0}.hero-tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px}.hero-tags span{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);padding:9px 12px;border-radius:999px;color:#d7e5f5;font-size:12px}.login-form-wrap{padding:60px 58px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:12px;color:var(--blue);font-weight:800;letter-spacing:2px}.login-form-wrap h2{font-size:32px;margin:10px 0 9px}.login-form-wrap>p{margin:0 0 28px;color:var(--muted);font-size:14px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:#536176;font-weight:700;margin:0 0 8px}.field input{width:100%;border:1px solid #dce4ef;background:#fbfcfe;padding:14px 15px;border-radius:13px;outline:none;transition:.2s}.field input:focus{border-color:#78aef7;box-shadow:0 0 0 4px rgba(47,128,237,.09);background:white}.primary{width:100%;border:0;border-radius:13px;padding:14px 16px;background:linear-gradient(90deg,#111c31,#223e65);color:white;font-weight:800;cursor:pointer;margin-top:14px;box-shadow:0 12px 26px rgba(17,28,49,.17)}.primary:disabled{opacity:.58;cursor:wait}.error{min-height:22px;color:var(--danger);font-size:12px;margin-top:10px}.tip{font-size:11px!important;color:#98a5b7!important;margin-top:18px!important;line-height:1.7}.app{min-height:100vh;display:grid;grid-template-columns:286px 1fr}.sidebar{background:linear-gradient(180deg,#0d1729,#101c31);color:white;padding:26px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.sidebar .brand{padding:4px 7px}.nav{display:grid;gap:8px;margin-top:42px}.nav button{border:0;background:transparent;color:#a9b8cb;text-align:left;padding:13px 14px;border-radius:13px;cursor:pointer;display:flex;align-items:center;gap:11px}.nav button:hover{background:rgba(255,255,255,.05);color:white}.nav button.on{background:linear-gradient(90deg,rgba(47,128,237,.22),rgba(22,199,177,.12));color:white;border:1px solid rgba(125,211,252,.13)}.dot{width:8px;height:8px;border-radius:50%;background:#2dd4bf;box-shadow:0 0 0 5px rgba(45,212,191,.09)}.sidebar-foot{margin-top:auto;padding:14px;border-top:1px solid rgba(255,255,255,.08);color:#8ea0b6;font-size:11px;line-height:1.7}.main{padding:34px 38px 60px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px}.title h1{font-size:30px;letter-spacing:-.5px;margin:0}.title p{margin:7px 0 0;color:var(--muted);font-size:13px}.top-actions{display:flex;align-items:center;gap:10px}.health{display:flex;align-items:center;gap:8px;background:#ecfdf5;color:#047857;border:1px solid #c7f2df;padding:9px 12px;border-radius:999px;font-size:12px}.ghost{border:1px solid #dce4ef;background:white;color:#374151;border-radius:11px;padding:10px 13px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:28px 0}.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:20px;padding:20px 20px 18px;box-shadow:0 8px 28px rgba(15,23,42,.035)}.card .k{font-size:12px;color:var(--muted);font-weight:700}.card .v{font-size:34px;font-weight:850;margin-top:9px;letter-spacing:-1px}.card .s{font-size:11px;color:#98a5b7;margin-top:4px}.panel{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:21px;box-shadow:var(--shadow);overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:19px 20px;border-bottom:1px solid var(--line)}.panel-head h3{font-size:15px;margin:0}.panel-head span{color:var(--muted);font-size:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{text-align:left;padding:14px 18px;border-bottom:1px solid #f0f3f7;font-size:12px;white-space:nowrap}.table th{color:#7b8799;font-size:11px;font-weight:800;background:#fbfcfe}.table td{color:#354256}.table td strong{color:#172033}.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700}.pill.active{background:#ecfdf5;color:#047857}.pill.disabled{background:#fff1f2;color:#be123c}.mini{border:1px solid #dde5ef;background:white;border-radius:9px;padding:7px 9px;cursor:pointer;font-size:11px}.mini.danger{color:#b91c1c;border-color:#fecaca;background:#fff7f7}.empty{padding:54px;text-align:center;color:#8a97a9;font-size:13px}.section{display:none}.section.on{display:block}.section:not(.overview){margin-top:28px}@media(max-width:1050px){.cards{grid-template-columns:1fr 1fr}.app{grid-template-columns:230px 1fr}.main{padding:28px 24px}}@media(max-width:800px){.login-card{grid-template-columns:1fr}.login-hero{display:none}.login-form-wrap{padding:44px 28px}.app{grid-template-columns:1fr}.sidebar{height:auto;position:relative}.nav{margin-top:20px;grid-template-columns:repeat(2,1fr)}.sidebar-foot{display:none}.main{padding:22px 14px}.cards{grid-template-columns:1fr 1fr}.topbar{align-items:flex-start;flex-direction:column}.table{min-width:680px}}@media(max-width:520px){.cards{grid-template-columns:1fr}.login{padding:12px}.login-card{min-height:auto;border-radius:22px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const API='https://cgjwbyvebzstiucmuyou.supabase.co/functions/v1/picshelf-platform';
const root=document.getElementById('root');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmt=d=>d?new Date(d).toLocaleString('zh-CN',{hour12:false}):'—';
const getToken=()=>sessionStorage.getItem('picshelf_admin_token')||'';
async function api(path,opt={}){const headers={...(opt.headers||{})};const t=getToken();if(t)headers.Authorization='Bearer '+t;if(opt.body&&!headers['Content-Type'])headers['Content-Type']='application/json';const r=await fetch(API+path,{...opt,headers});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||('请求失败 '+r.status));return j}
function brand(){return `<div class="brand"><div class="logo"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="5" y="7" width="31" height="25" rx="5" fill="white" opacity=".95"/><circle cx="29" cy="14" r="4" fill="#ffd447"/><path d="M6 29l10-10 8 8 6-6 6 7v4H6z" fill="#31c9b5"/><path d="M5 36h38" stroke="white" stroke-width="4" stroke-linecap="round"/><path d="M39 9v20M44 13v16" stroke="#cfe3ff" stroke-width="3" stroke-linecap="round"/></svg></div><div><b>图架 PicShelf</b><small>ADMIN CONSOLE</small></div></div>`}
function login(){root.innerHTML=`<div class="login"><div class="login-card"><section class="login-hero">${brand()}<div class="hero-copy"><h1>让视觉资产管理<br>清晰、可控、可追踪</h1><p>统一管理用户、设备、云端素材与同步状态。后台与桌面端使用独立管理员会话，避免浏览器第三方 Cookie 限制造成登录异常。</p><div class="hero-tags"><span>账号管理</span><span>设备同步</span><span>素材统计</span><span>智能分类数据</span></div></div></section><section class="login-form-wrap"><div class="eyebrow">SECURE SIGN IN</div><h2>登录管理后台</h2><p>请输入管理员账号与密码</p><div class="field"><label>管理员账号</label><input id="username" value="admin" autocomplete="username"></div><div class="field"><label>管理员密码</label><input id="password" type="password" autocomplete="current-password" placeholder="请输入管理员密码"></div><div class="error" id="error"></div><button class="primary" id="loginBtn">登录后台</button><p class="tip">安全提示：管理令牌只保存在当前浏览器会话中，关闭浏览器后自动清除。</p></section></div></div>`;const btn=document.getElementById('loginBtn');const submit=async()=>{const e=document.getElementById('error');e.textContent='';btn.disabled=true;btn.textContent='正在验证…';try{const d=await api('/admin/login',{method:'POST',body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});if(!d.token)throw new Error('服务器未返回管理令牌');sessionStorage.setItem('picshelf_admin_token',d.token);await dashboard()}catch(x){e.textContent=x.message||'登录失败';btn.disabled=false;btn.textContent='登录后台'}};btn.onclick=submit;document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')submit()})}
async function dashboard(){root.innerHTML=`<div class="app"><aside class="sidebar">${brand()}<nav class="nav"><button class="on" data-tab="overview">◈ 运营总览</button><button data-tab="users">◎ 用户管理</button><button data-tab="devices">▣ 设备与同步</button><button data-tab="assets">▤ 素材数据</button></nav><div class="sidebar-foot"><div style="display:flex;align-items:center;gap:9px;margin-bottom:5px"><span class="dot"></span><span>PicShelf Platform Online</span></div>管理接口与前端页面已分离部署</div></aside><main class="main"><header class="topbar"><div class="title"><h1 id="pageTitle">运营总览</h1><p id="pageDesc">用户、设备、同步与素材状态</p></div><div class="top-actions"><div class="health"><span class="dot"></span>服务正常</div><button class="ghost" id="logoutBtn">退出登录</button></div></header><section class="section overview on" id="overview"><div class="cards" id="cards"></div><div class="panel"><div class="panel-head"><h3>最近注册用户</h3><span>最新 50 条</span></div><div class="table-wrap" id="recentUsers"></div></div></section><section class="section" id="users"><div class="panel"><div class="panel-head"><h3>用户管理</h3><span>可停用 / 恢复账号</span></div><div class="table-wrap" id="userTable"></div></div></section><section class="section" id="devices"><div class="panel"><div class="panel-head"><h3>设备与同步</h3><span>最近同步设备</span></div><div class="table-wrap" id="deviceTable"></div></div></section><section class="section" id="assets"><div class="panel"><div class="panel-head"><h3>云端素材</h3><span>最近同步素材</span></div><div class="table-wrap" id="assetTable"></div></div></section></main></div>`;
document.getElementById('logoutBtn').onclick=async()=>{try{await api('/admin/logout',{method:'POST'})}catch{}sessionStorage.removeItem('picshelf_admin_token');login()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));await loadOverview()}
function switchTab(tab){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));document.querySelectorAll('.section').forEach(s=>s.classList.toggle('on',s.id===tab));const map={overview:['运营总览','用户、设备、同步与素材状态'],users:['用户管理','管理注册账号与使用状态'],devices:['设备与同步','查看客户端设备及最近同步'],assets:['素材数据','查看云端素材与智能分类结果']};document.getElementById('pageTitle').textContent=map[tab][0];document.getElementById('pageDesc').textContent=map[tab][1];if(tab==='users')loadUsers();if(tab==='devices')loadDevices();if(tab==='assets')loadAssets()}
function usersTable(rows,actions=false){if(!rows.length)return '<div class="empty">暂无用户数据</div>';return `<table class="table"><thead><tr><th>用户</th><th>邮箱</th><th>状态</th><th>注册时间</th><th>最近登录</th>${actions?'<th>操作</th>':''}</tr></thead><tbody>${rows.map(u=>`<tr><td><strong>${esc(u.username)}</strong></td><td>${esc(u.email)}</td><td><span class="pill ${u.status==='active'?'active':'disabled'}">${u.status==='active'?'正常':'已停用'}</span></td><td>${fmt(u.created_at)}</td><td>${fmt(u.last_login_at)}</td>${actions?`<td><button class="mini ${u.status==='active'?'danger':''}" onclick="setUserStatus('${esc(u.id)}','${u.status==='active'?'disabled':'active'}')">${u.status==='active'?'停用':'恢复'}</button></td>`:''}</tr>`).join('')}</tbody></table>`}
async function loadOverview(){try{const d=await api('/admin/data');const a=[['注册用户',d.stats.users,'累计注册账号'],['活跃设备',d.stats.devices,'已建立同步的设备'],['云端素材',d.stats.assets,'未删除的素材'],['同步事件',d.stats.events,'累计平台事件']];document.getElementById('cards').innerHTML=a.map(x=>`<div class="card"><div class="k">${x[0]}</div><div class="v">${Number(x[1]||0).toLocaleString()}</div><div class="s">${x[2]}</div></div>`).join('');document.getElementById('recentUsers').innerHTML=usersTable(d.users||[])}catch(e){if(e.message.includes('未登录'))return reauth();document.getElementById('recentUsers').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function loadUsers(){try{const d=await api('/admin/users');document.getElementById('userTable').innerHTML=usersTable(d.users||[],true)}catch(e){document.getElementById('userTable').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function setUserStatus(id,status){if(!confirm(status==='disabled'?'确认停用这个用户？':'确认恢复这个用户？'))return;try{await api('/admin/user/status',{method:'POST',body:JSON.stringify({id,status})});await loadUsers();await loadOverview()}catch(e){alert(e.message)}}
async function loadDevices(){try{const d=await api('/admin/devices');const rows=d.devices||[];document.getElementById('deviceTable').innerHTML=rows.length?`<table class="table"><thead><tr><th>用户</th><th>设备名称</th><th>设备 ID</th><th>版本</th><th>素材数</th><th>最近同步</th></tr></thead><tbody>${rows.map(x=>`<tr><td><strong>${esc(x.username||x.user_id)}</strong></td><td>${esc(x.device_name||'Windows PC')}</td><td>${esc(x.device_id)}</td><td>${esc(x.app_version)}</td><td>${Number(x.asset_count||0).toLocaleString()}</td><td>${fmt(x.last_sync_at)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无设备同步数据</div>'}catch(e){document.getElementById('deviceTable').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function loadAssets(){try{const d=await api('/admin/assets');const rows=d.assets||[];document.getElementById('assetTable').innerHTML=rows.length?`<table class="table"><thead><tr><th>素材</th><th>用户</th><th>智能分类</th><th>置信度</th><th>尺寸</th><th>同步时间</th></tr></thead><tbody>${rows.map(x=>`<tr><td><strong>${esc(x.name||x.asset_id)}</strong></td><td>${esc(x.username||x.user_id)}</td><td><span class="pill active">${esc(x.smart_category||'未分类')}</span></td><td>${Number(x.smart_confidence||0)}%</td><td>${Number(x.width||0)} × ${Number(x.height||0)}</td><td>${fmt(x.synced_at)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无云端素材数据</div>'}catch(e){document.getElementById('assetTable').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function reauth(){sessionStorage.removeItem('picshelf_admin_token');login()}
(async()=>{try{if(!getToken())return login();await api('/admin/me');await dashboard()}catch{reauth()}})();
</script>
</body>
</html>

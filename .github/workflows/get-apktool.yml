name: Prepare Android Build Tools
on:
  push:
    paths:
      - '.github/workflows/get-apktool.yml'
  pull_request:
    paths:
      - '.github/workflows/get-apktool.yml'
      - 'xiaoxiaoshuo/.build-trigger'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Download Apktool
        run: |
          set -eux
          curl -L --fail -o apktool_3.0.3.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool_3.0.3.jar' | sha256sum -c -
      - name: Upload Apktool
        uses: actions/upload-artifact@v4
        with:
          name: apktool-3.0.3
          path: apktool_3.0.3.jar
          retention-days: 1

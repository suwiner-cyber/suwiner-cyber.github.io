name: Build LingYue Audiobook APK

on:
  push:
    branches:
      - chatgpt-audiobook-build-20260901
    paths:
      - 'audiobook-lite/**'
      - '.github/workflows/chatgpt-audiobook-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: audiobook-lite
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Sign and verify APK
        run: |
          UNSIGNED=$(find audiobook-lite/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)
          test -s "$UNSIGNED"
          keytool -genkeypair -v -keystore /tmp/lingyue-release.jks -storepass LingYue2026 -keypass LingYue2026 -alias lingyue -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=LingYue, OU=Android, O=Suwiner, L=Tokyo, ST=Tokyo, C=JP'
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" sign --ks /tmp/lingyue-release.jks --ks-key-alias lingyue --ks-pass pass:LingYue2026 --key-pass pass:LingYue2026 --out LingYue-Audiobook-v1.0.1.apk "$UNSIGNED"
          "$APKSIGNER" verify --verbose LingYue-Audiobook-v1.0.1.apk
          test -s LingYue-Audiobook-v1.0.1.apk
          sha256sum LingYue-Audiobook-v1.0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LingYue-Audiobook-v1.0.1
          path: LingYue-Audiobook-v1.0.1.apk
          if-no-files-found: error
          retention-days: 7

name: Prepare APK Signer
on:
  push:
    paths:
      - '.github/workflows/get-uber-apk-signer.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Download signer
        run: |
          set -eux
          curl -L --fail -o uber-apk-signer-1.3.0.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
      - name: Upload signer
        uses: actions/upload-artifact@v4
        with:
          name: uber-apk-signer-1.3.0
          path: uber-apk-signer-1.3.0.jar
          retention-days: 1

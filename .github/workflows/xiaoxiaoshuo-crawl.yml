name: 小小说中文书库 v5 · 12小时更新
on:
  workflow_dispatch:
  push:
    paths:
      - 'xiaoxiaoshuo/config/sources.json'
      - 'xiaoxiaoshuo/config/public_sources.json'
      - 'xiaoxiaoshuo/tools/crawl_v4.py'
      - 'xiaoxiaoshuo/tools/crawl_v5.py'
      - 'xiaoxiaoshuo/tools/mirror_v5.py'
      - 'xiaoxiaoshuo/all-catalog.html'
      - 'xiaoxiaoshuo/reader.html'
      - '.github/workflows/xiaoxiaoshuo-crawl.yml'
  schedule:
    - cron: '17 */12 * * *'

permissions:
  contents: write

concurrency:
  group: xiaoxiaoshuo-v5-main
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3

      - name: Build Chinese-only deduplicated multi-source catalog v5
        run: python xiaoxiaoshuo/tools/crawl_v5.py

      - name: Mirror public chapters from explicitly authorized text sources
        run: python xiaoxiaoshuo/tools/mirror_v5.py

      - name: Publish catalog and reader data
        run: |
          set -e
          git config user.name "xiaoxiaoshuo-library-bot"
          git config user.email "actions@users.noreply.github.com"
          git add xiaoxiaoshuo/data/v4 xiaoxiaoshuo/data/v5
          if git diff --cached --quiet; then
            echo "No new catalog or chapter data; discovered sources may already be exhausted."
            exit 0
          fi
          git commit -m "Update XiaoXiaoShuo Chinese catalog and reader data"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 4))
          done
          exit 1

name: 小小说中文书库 v6 · 12小时更新
on:
  workflow_dispatch:
  push:
    paths:
      - 'xiaoxiaoshuo/config/sources.json'
      - 'xiaoxiaoshuo/tools/crawl_six_full.py'
      - 'xiaoxiaoshuo/tools/mirror_authorized_extra.py'
      - 'xiaoxiaoshuo/all-catalog.html'
      - 'xiaoxiaoshuo/reader.html'
      - '.github/workflows/xiaoxiaoshuo-crawl.yml'
  schedule:
    - cron: '17 */12 * * *'

permissions:
  contents: write

concurrency:
  group: xiaoxiaoshuo-v6-main
  cancel-in-progress: true

jobs:
  crawl-six-full:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3

      - name: Crawl, mirror and publish in resumable batches
        shell: bash
        run: |
          set -e
          git config user.name "xiaoxiaoshuo-library-bot"
          git config user.email "actions@users.noreply.github.com"
          start=$(date +%s)
          round=1
          while true; do
            echo "===== six-site batch $round ====="
            python xiaoxiaoshuo/tools/crawl_six_full.py --pages-per-source 80
            python xiaoxiaoshuo/tools/mirror_authorized_extra.py

            git add xiaoxiaoshuo/data/v5
            if ! git diff --cached --quiet; then
              git commit -m "Update six-site crawl batch $round"
              pushed=no
              for attempt in 1 2 3 4 5; do
                git fetch origin main
                if git rebase origin/main && git push origin HEAD:main; then
                  pushed=yes
                  break
                fi
                git rebase --abort || true
                sleep $((attempt * 3))
              done
              if [ "$pushed" != "yes" ]; then
                echo "Unable to publish crawl batch"
                exit 1
              fi
            fi

            all_done=$(python -c "import json; from pathlib import Path; d=json.loads(Path('xiaoxiaoshuo/data/v5/six_full_status.json').read_text(encoding='utf-8')); print('yes' if d.get('all_done') else 'no')")
            python -c "import json; from pathlib import Path; d=json.loads(Path('xiaoxiaoshuo/data/v5/six_full_status.json').read_text(encoding='utf-8')); print(json.dumps(d,ensure_ascii=False,indent=2))"
            if [ "$all_done" = "yes" ]; then
              echo "All discoverable public pages for the six authorized sources are exhausted."
              break
            fi

            now=$(date +%s)
            elapsed=$((now-start))
            if [ "$elapsed" -ge 15000 ]; then
              echo "Time budget reached. Current cursor is already published; next 12-hour run resumes here."
              break
            fi
            round=$((round+1))
          done

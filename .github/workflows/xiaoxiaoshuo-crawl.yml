name: 小小说中文书库 v7 · 8源正文同步
on:
  workflow_dispatch:
  push:
    paths:
      - 'xiaoxiaoshuo/config/sources.json'
      - 'xiaoxiaoshuo/tools/crawl_v4.py'
      - 'xiaoxiaoshuo/tools/crawl_six_full.py'
      - 'xiaoxiaoshuo/tools/normalize_library_ids.py'
      - 'xiaoxiaoshuo/tools/mirror_v5.py'
      - 'xiaoxiaoshuo/tools/mirror_authorized_extra.py'
      - 'xiaoxiaoshuo/all-catalog.html'
      - 'xiaoxiaoshuo/reader.html'
      - '.github/workflows/xiaoxiaoshuo-crawl.yml'
  schedule:
    - cron: '17 */12 * * *'

permissions:
  contents: write

concurrency:
  group: xiaoxiaoshuo-v7-main
  cancel-in-progress: true

jobs:
  crawl-all:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3

      - name: Crawl and publish all authorized text sources in batches
        shell: bash
        run: |
          set -e
          git config user.name "xiaoxiaoshuo-library-bot"
          git config user.email "actions@users.noreply.github.com"
          start=$(date +%s)
          round=1

          # Keep the original two sources advancing too.
          python xiaoxiaoshuo/tools/crawl_v4.py || true

          while true; do
            echo "===== eight-source batch $round ====="
            python xiaoxiaoshuo/tools/crawl_six_full.py --pages-per-source 60
            python xiaoxiaoshuo/tools/normalize_library_ids.py
            python xiaoxiaoshuo/tools/mirror_v5.py || true
            python xiaoxiaoshuo/tools/mirror_authorized_extra.py || true

            git add xiaoxiaoshuo/data/v4 xiaoxiaoshuo/data/v5
            if ! git diff --cached --quiet; then
              git commit -m "Update eight-source readable catalog batch $round"
              pushed=no
              for attempt in 1 2 3 4 5; do
                git fetch origin main
                if git rebase origin/main && git push origin HEAD:main; then
                  pushed=yes
                  break
                fi
                git rebase --abort || true
                sleep $((attempt * 3))
              done
              if [ "$pushed" != "yes" ]; then
                echo "Unable to publish batch"
                exit 1
              fi
            fi

            all_done=$(python -c "import json; from pathlib import Path; p=Path('xiaoxiaoshuo/data/v5/six_full_status.json'); d=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}; print('yes' if d.get('all_done') else 'no')")
            now=$(date +%s)
            elapsed=$((now-start))
            if [ "$all_done" = "yes" ] || [ "$elapsed" -ge 15000 ]; then
              break
            fi
            round=$((round+1))
          done

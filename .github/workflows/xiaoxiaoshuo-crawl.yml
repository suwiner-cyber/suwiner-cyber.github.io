name: 小小说中文书库 v14 · 13书源增量即时发布
on:
  workflow_dispatch:
  push:
    paths:
      - 'xiaoxiaoshuo/config/sources.json'
      - 'xiaoxiaoshuo/tools/crawl_authorized_v13.py'
      - 'xiaoxiaoshuo/tools/crawl_authorized_v14.py'
      - 'xiaoxiaoshuo/tools/normalize_library_ids.py'
      - 'xiaoxiaoshuo/tools/mirror_text_universal.py'
      - 'xiaoxiaoshuo/tools/repair_covers.py'
      - 'xiaoxiaoshuo/tools/purge_audio.py'
      - 'xiaoxiaoshuo/reader.html'
      - 'xiaoxiaoshuo/all-catalog.html'
      - 'xiaoxiaoshuo/admin/index.html'
      - '.github/workflows/xiaoxiaoshuo-crawl.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: xiaoxiaoshuo-v14-incremental
  cancel-in-progress: true

jobs:
  crawl-all:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3

      - name: Crawl each authorized source and publish immediately
        shell: bash
        run: |
          set -e
          git config user.name "xiaoxiaoshuo-library-bot"
          git config user.email "actions@users.noreply.github.com"

          publish() {
            source="$1"
            echo "===== v14 source: $source ====="
            python xiaoxiaoshuo/tools/crawl_authorized_v14.py --source "$source" --pages-per-source 80
            python xiaoxiaoshuo/tools/normalize_library_ids.py
            python xiaoxiaoshuo/tools/purge_audio.py
            git add xiaoxiaoshuo/data/v5
            if git diff --cached --quiet; then
              echo "No changes for $source"
              return 0
            fi
            git commit -m "v14 publish source $source"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                return 0
              fi
              git rebase --abort || true
              sleep $((attempt * 3))
            done
            echo "Unable to publish source $source"
            exit 1
          }

          # New/previously missing sources first so the public index changes quickly.
          publish "69shuba.com"
          publish "1qxs.com"
          publish "piaotia.com"
          publish "hetushu.com"
          publish "ilwxs.com"
          publish "ipaoshubaxs.net"
          publish "aaaks.com"
          publish "99csw.com"
          publish "ixdzs8.com"
          publish "tadu.com"
          publish "kanunu8.com"
          publish "xs8.cn"
          publish "zwxiaoshuo.com"

          # Background enrichment after all 13 searchable indexes have been published.
          python xiaoxiaoshuo/tools/mirror_text_universal.py || true
          python xiaoxiaoshuo/tools/repair_covers.py || true
          python xiaoxiaoshuo/tools/purge_audio.py
          git add xiaoxiaoshuo/data/v5
          if ! git diff --cached --quiet; then
            git commit -m "v14 enrich full text and covers"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                break
              fi
              git rebase --abort || true
              sleep $((attempt * 3))
            done
          fi

name: 小小说中央书库 · 定时更新
on:
  workflow_dispatch:
  push:
    paths:
      - 'xiaoxiaoshuo/config/sources.json'
      - 'xiaoxiaoshuo/tools/crawl_all.py'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: xiaoxiaoshuo-library-crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3
      - name: Build resumable full-site catalog
        run: python xiaoxiaoshuo/tools/crawl_all.py
      - name: Build readable static library
        run: python xiaoxiaoshuo/tools/crawl.py
      - name: Commit library changes
        run: |
          git config user.name "xiaoxiaoshuo-library-bot"
          git config user.email "actions@users.noreply.github.com"
          git add xiaoxiaoshuo/data xiaoxiaoshuo/books xiaoxiaoshuo/chapters xiaoxiaoshuo/catalog.html xiaoxiaoshuo/all-catalog.html || true
          if ! git diff --cached --quiet; then
            git commit -m "Update XiaoXiaoShuo central library"
            git push
          fi

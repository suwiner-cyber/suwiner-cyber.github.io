name: 小小说中文书库 v12 · 全本正文与真实封面
on:
  workflow_dispatch:
  push:
    paths:
      - 'xiaoxiaoshuo/config/sources.json'
      - 'xiaoxiaoshuo/tools/crawl_v4.py'
      - 'xiaoxiaoshuo/tools/crawl_six_full.py'
      - 'xiaoxiaoshuo/tools/crawl_full_recheck.py'
      - 'xiaoxiaoshuo/tools/normalize_library_ids.py'
      - 'xiaoxiaoshuo/tools/mirror_text_universal.py'
      - 'xiaoxiaoshuo/tools/repair_covers.py'
      - 'xiaoxiaoshuo/tools/purge_audio.py'
      - 'xiaoxiaoshuo/reader.html'
      - 'xiaoxiaoshuo/all-catalog.html'
      - 'xiaoxiaoshuo/admin/index.html'
      - '.github/workflows/xiaoxiaoshuo-crawl.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: xiaoxiaoshuo-fullbook-stable
  cancel-in-progress: true

jobs:
  crawl-all:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3

      - name: Full catalog, full text and real-cover synchronization
        shell: bash
        run: |
          set -e
          git config user.name "xiaoxiaoshuo-library-bot"
          git config user.email "actions@users.noreply.github.com"
          start=$(date +%s)
          round=1

          python xiaoxiaoshuo/tools/crawl_v4.py || true
          python xiaoxiaoshuo/tools/purge_audio.py

          while true; do
            echo "===== full-book batch $round ====="
            python xiaoxiaoshuo/tools/crawl_full_recheck.py --pages-per-source 80
            python xiaoxiaoshuo/tools/normalize_library_ids.py
            python xiaoxiaoshuo/tools/mirror_text_universal.py || true
            python xiaoxiaoshuo/tools/repair_covers.py || true
            python xiaoxiaoshuo/tools/purge_audio.py

            git add xiaoxiaoshuo/data/v4 xiaoxiaoshuo/data/v5
            if ! git diff --cached --quiet; then
              git commit -m "Sync full novels, complete TOC and real covers batch $round"
              pushed=no
              for attempt in 1 2 3 4 5; do
                git fetch origin main
                if git rebase origin/main && git push origin HEAD:main; then
                  pushed=yes
                  break
                fi
                git rebase --abort || true
                sleep $((attempt * 3))
              done
              if [ "$pushed" != "yes" ]; then
                echo "Unable to publish batch"
                exit 1
              fi
            fi

            index_done=$(python -c "import json; from pathlib import Path; p=Path('xiaoxiaoshuo/data/v5/six_full_status.json'); d=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}; print('yes' if d.get('all_done') else 'no')")
            text_done=$(python -c "import json; from pathlib import Path; p=Path('xiaoxiaoshuo/data/v5/universal_mirror_status.json'); d=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}; print('yes' if d.get('all_fulltext_done') else 'no')")
            cover_done=$(python -c "import json; from pathlib import Path; p=Path('xiaoxiaoshuo/data/v5/cover_repair_state.json'); d=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}; print('yes' if d.get('cycle_complete') else 'no')")
            now=$(date +%s)
            elapsed=$((now-start))
            if [ "$index_done" = "yes" ] && [ "$text_done" = "yes" ] && [ "$cover_done" = "yes" ]; then
              echo "Catalog, readable public text and real-cover pass complete."
              break
            fi
            if [ "$elapsed" -ge 15000 ]; then
              echo "Time budget reached; published progress will resume next run."
              break
            fi
            round=$((round+1))
          done

name: 小小说中央书库 · 12小时更新
on:
  workflow_dispatch:
  push:
    paths:
      - 'xiaoxiaoshuo/config/sources.json'
      - 'xiaoxiaoshuo/tools/crawl_v4.py'
      - 'xiaoxiaoshuo/all-catalog.html'
      - '.github/workflows/xiaoxiaoshuo-crawl.yml'
  schedule:
    - cron: '17 */12 * * *'

permissions:
  contents: write

concurrency:
  group: xiaoxiaoshuo-v4-main
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3

      - name: Run catalog-first crawler v4
        run: python xiaoxiaoshuo/tools/crawl_v4.py

      - name: Publish v4 catalog data
        run: |
          set -e
          git config user.name "xiaoxiaoshuo-library-bot"
          git config user.email "actions@users.noreply.github.com"
          git add xiaoxiaoshuo/data/v4
          if git diff --cached --quiet; then
            echo "No v4 catalog changes"
            exit 0
          fi
          git commit -m "Update XiaoXiaoShuo v4 catalog data"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1

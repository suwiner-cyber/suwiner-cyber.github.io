name: Fetch Zipalign Lib Temporary

on:
  push:
    paths:
      - '.github/workflows/fetch-zipalign-lib-temp.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Collect zipalign runtime
        shell: bash
        run: |
          set -euo pipefail
          latest="$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          mkdir -p zipalign-runtime/lib64
          cp "$latest/zipalign" zipalign-runtime/
          cp "$latest/lib64/libc++.so" zipalign-runtime/lib64/
          chmod +x zipalign-runtime/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: zipalign-runtime
          path: zipalign-runtime
          retention-days: 1

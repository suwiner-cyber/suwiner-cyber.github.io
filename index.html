<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的网站</title>
  <meta name="description" content="个人网站" />
  <style>
    :root{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#152038;background:#f6f8fc}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#e9f1ff 0,transparent 32%),radial-gradient(circle at 90% 20%,#efe9ff 0,transparent 28%),#f7f9fd}
    .card{width:min(860px,100%);padding:64px 48px;border:1px solid rgba(20,32,56,.08);border-radius:32px;background:rgba(255,255,255,.82);box-shadow:0 24px 70px rgba(33,52,86,.12);backdrop-filter:blur(16px)}
    .badge{display:inline-block;padding:8px 14px;border-radius:999px;background:#eef4ff;color:#315dce;font-weight:700;font-size:14px;letter-spacing:.04em}
    h1{font-size:clamp(40px,8vw,76px);line-height:1.04;margin:24px 0 18px;letter-spacing:-.04em}p{font-size:18px;line-height:1.9;color:#5b667d;max-width:620px;margin:0}
    .line{width:72px;height:6px;border-radius:999px;background:linear-gradient(90deg,#4f7cff,#8d63ff);margin-top:34px}
    footer{margin-top:48px;font-size:13px;color:#8c96a8}
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">SITE ONLINE</span>
    <h1>网站已准备就绪</h1>
    <p>这是你的免费网站主页。域名、HTTPS 和静态托管部署完成后，你可以继续在这里放作品集、项目介绍、软件下载页、博客或企业官网。</p>
    <div class="line"></div>
    <footer>Powered by GitHub Pages</footer>
  </main>
</body>
</html>

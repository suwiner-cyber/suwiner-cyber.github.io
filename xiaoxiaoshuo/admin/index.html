<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>小小说管理后台</title>
<style>
:root{--bg:#f5f7f8;--panel:#fff;--ink:#17211c;--muted:#6b756f;--green:#145f4b;--green2:#1f8067;--line:#e5e9e7;--danger:#b42318}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#0f3f34;color:#fff;padding:26px 18px;position:sticky;top:0;height:100vh}.brand{font-size:22px;font-weight:800;margin-bottom:28px}.brand small{display:block;font-size:12px;font-weight:500;opacity:.62;margin-top:6px}.nav button{width:100%;border:0;background:transparent;color:#cfe2dc;text-align:left;padding:12px 14px;border-radius:12px;margin:4px 0;cursor:pointer;font-size:14px}.nav button.active,.nav button:hover{background:rgba(255,255,255,.12);color:#fff}.main{padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{font-size:24px;margin:0}.top .right{display:flex;gap:10px}.btn{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:10px;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.cards{display:grid;grid-template-columns:repeat(6,minmax(140px,1fr));gap:12px;margin-bottom:22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px}.card .k{color:var(--muted);font-size:12px}.card .v{font-size:24px;font-weight:800;margin-top:8px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panel-head b{font-size:15px}.table-wrap{overflow:auto;max-height:65vh}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:12px 14px;border-bottom:1px solid #eef1ef;white-space:nowrap;text-align:left;max-width:320px;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;background:#fafbfb;color:#55615a;font-weight:650}.empty{padding:42px;text-align:center;color:var(--muted)}.login{position:fixed;inset:0;background:rgba(8,24,18,.55);display:flex;align-items:center;justify-content:center;z-index:9}.login-card{width:min(420px,92vw);background:#fff;border-radius:20px;padding:26px;box-shadow:0 24px 80px rgba(0,0,0,.25)}.login-card h2{margin:0 0 8px}.login-card p{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.7}.login-card input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:15px;margin-bottom:12px}.hint{font-size:12px;color:var(--muted);margin-top:12px}.status{font-size:12px;color:var(--muted)}.error{color:var(--danger)}@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{height:auto;position:static}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.main{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="login" id="login"><div class="login-card"><h2>小小说管理后台</h2><p>请输入后台管理密钥。密钥只保存在当前浏览器会话中，不写入网页源码。</p><input id="key" type="password" placeholder="管理密钥" autocomplete="off"/><button class="btn primary" style="width:100%" onclick="login()">进入后台</button><div class="hint" id="loginMsg">用于查看用户、设备、阅读记录、使用日志和缓存状态。</div></div></div>
<div class="shell"><aside class="side"><div class="brand">小小说<small>运营管理中心</small></div><div class="nav" id="nav"><button class="active" data-view="devices">设备</button><button data-view="users">用户</button><button data-view="sessions">会话</button><button data-view="reading">阅读记录</button><button data-view="events">使用事件</button><button data-view="cache">缓存记录</button></div></aside>
<main class="main"><div class="top"><div><h1 id="title">设备</h1><div class="status" id="status">尚未连接</div></div><div class="right"><button class="btn" onclick="refresh()">刷新</button><button class="btn" onclick="logout()">锁定后台</button></div></div>
<div class="cards"><div class="card"><div class="k">用户总数</div><div class="v" id="mUsers">0</div></div><div class="card"><div class="k">设备总数</div><div class="v" id="mDevices">0</div></div><div class="card"><div class="k">24h 会话</div><div class="v" id="mSessions">0</div></div><div class="card"><div class="k">24h 事件</div><div class="v" id="mEvents">0</div></div><div class="card"><div class="k">24h 阅读</div><div class="v" id="mRead">0 分</div></div><div class="card"><div class="k">缓存占用</div><div class="v" id="mCache">0 MB</div></div></div>
<div class="panel"><div class="panel-head"><b id="panelTitle">设备列表</b><span class="status">最多显示最近 200 条</span></div><div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty">暂无数据</div></div></div></main></div>
<script>
const API='https://cgjwbyvebzstiucmuyou.supabase.co/functions/v1/xiaoxiaoshuo-admin';
let key=sessionStorage.getItem('xxs_admin_key')||'';let view='devices';
const titles={devices:'设备',users:'用户',sessions:'会话',reading:'阅读记录',events:'使用事件',cache:'缓存记录'};
function fmtBytes(n){n=Number(n||0);return n<1024*1024?(n/1024).toFixed(1)+' KB':(n/1024/1024).toFixed(1)+' MB'}
function fmtTime(v){if(!v)return '';try{return new Date(v).toLocaleString('zh-CN',{hour12:false})}catch{return v}}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function api(path){const r=await fetch(API+'/'+path,{headers:{'x-admin-key':key}});if(r.status===403)throw new Error('管理密钥错误');if(!r.ok)throw new Error('接口请求失败 '+r.status);return r.json()}
async function login(){key=document.getElementById('key').value.trim();if(!key)return;document.getElementById('loginMsg').textContent='正在验证…';try{await api('summary');sessionStorage.setItem('xxs_admin_key',key);document.getElementById('login').style.display='none';await refresh()}catch(e){document.getElementById('loginMsg').innerHTML='<span class="error">'+esc(e.message)+'</span>'}}
function logout(){sessionStorage.removeItem('xxs_admin_key');key='';document.getElementById('key').value='';document.getElementById('login').style.display='flex'}
async function refresh(){document.getElementById('status').textContent='正在同步数据…';try{const [s,list]=await Promise.all([api('summary'),api(view+'?limit=200')]);document.getElementById('mUsers').textContent=s.users;document.getElementById('mDevices').textContent=s.devices;document.getElementById('mSessions').textContent=s.sessions_24h;document.getElementById('mEvents').textContent=s.events_24h;document.getElementById('mRead').textContent=Math.round((s.read_seconds_24h||0)/60)+' 分';document.getElementById('mCache').textContent=fmtBytes(s.cache_bytes);render(list.data||[]);document.getElementById('status').textContent='已连接 · '+new Date().toLocaleTimeString('zh-CN',{hour12:false})}catch(e){document.getElementById('status').innerHTML='<span class="error">'+esc(e.message)+'</span>';if(String(e.message).includes('密钥'))logout()}}
function render(rows){document.getElementById('title').textContent=titles[view];document.getElementById('panelTitle').textContent=titles[view]+'列表';const empty=document.getElementById('empty');const thead=document.getElementById('thead'),tbody=document.getElementById('tbody');thead.innerHTML='';tbody.innerHTML='';if(!rows.length){empty.style.display='block';return}empty.style.display='none';const priority={devices:['device_id','manufacturer','model','os_name','os_version','app_version','last_seen_at'],users:['external_user_id','display_name','last_seen_at','created_at'],sessions:['device_id','started_at','ended_at','duration_seconds','app_version','network_type'],reading:['device_id','book_title','chapter_index','chapter_title','progress','read_seconds','updated_at'],events:['device_id','event_name','screen_name','app_version','occurred_at','properties'],cache:['device_id','cache_type','book_id','chapter_index','size_bytes','status','updated_at']};const cols=(priority[view]||Object.keys(rows[0])).filter(c=>rows.some(r=>c in r));thead.innerHTML='<tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>';tbody.innerHTML=rows.map(r=>'<tr>'+cols.map(c=>{let v=r[c];if(c.endsWith('_at'))v=fmtTime(v);else if(c==='size_bytes')v=fmtBytes(v);else if(typeof v==='object'&&v!==null)v=JSON.stringify(v);return '<td title="'+esc(v)+'">'+esc(v)+'</td>'}).join('')+'</tr>').join('')}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(!b)return;document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;refresh()});
if(key){document.getElementById('login').style.display='none';refresh()}
</script>
</body></html>

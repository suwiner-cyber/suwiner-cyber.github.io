<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小小说 · 全站索引库 v4</title><style>:root{--bg:#f5f3ec;--card:#fff;--ink:#1b2823;--muted:#68736e;--line:#e5e0d5;--green:#176b55}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:1160px;margin:auto;padding:24px;background:var(--bg);color:var(--ink)}.top,.book,.notice{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}.head{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.count{font-size:32px;font-weight:800;color:var(--green)}button{border:0;border-radius:12px;padding:10px 16px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}.book{display:grid;grid-template-columns:72px 1fr;gap:14px}.book img{width:72px;height:96px;object-fit:cover;border-radius:9px;background:#eee}.meta,.muted{color:var(--muted)}a{color:var(--green)}#list{content-visibility:auto}.pager{display:flex;gap:10px;justify-content:center;align-items:center;padding:18px}.error{color:#a33}.ok{color:var(--green)}@media(max-width:600px){body{padding:12px}.book{grid-template-columns:56px 1fr}.book img{width:56px;height:78px}}</style></head><body><section class="top"><div class="head"><div><h1>小小说 · 全站索引库 v4</h1><div class="count" id="count">0 本</div></div><button id="reload">刷新数据</button></div><p id="status">正在读取 v4 索引…</p><p class="muted" id="updated">等待首次 v4 抓取</p><p class="muted" id="sources"></p></section><main id="list"><section class="notice"><p>正在连接 v4 分片书库。</p></section></main><div class="pager" id="pager"></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let index=null,page=1;const pageSize=100;async function getJson(url){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),10000);try{const r=await fetch(url+(url.includes('?')?'&':'?')+'v='+Date.now(),{cache:'no-store',signal:ctl.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}function renderRows(rows){$('list').innerHTML=rows.length?rows.map(b=>`<article class="book"><img src="${esc(b.cover||'')}" loading="lazy" onerror="this.style.visibility='hidden'"><div><h3>${esc(b.title||'未命名')}</h3><p class="meta">${esc(b.author||'未知作者')} · ${esc(b.kind||'未分类')} · ${esc(b.status||'')} · ${Number(b.chapter_count||0)}章/集 · ${esc(b.source_name||'')}</p><p>${esc(b.intro||'')}</p>${b.source_url?`<a href="${esc(b.source_url)}" target="_blank" rel="nofollow noopener">源站详情</a>`:''}</div></article>`).join(''):'<section class="notice"><p>这一页暂时没有书。</p></section>'}async function loadPage(p){if(!index)return;page=Math.max(1,p);const start=(page-1)*pageSize,end=Math.min(index.total,start+pageSize);if(start>=index.total){page=1;return loadPage(1)}const first=Math.floor(start/index.shard_size),last=Math.floor((end-1)/index.shard_size),rows=[];for(let i=first;i<=last;i++){const shard=index.shards[i];if(!shard)continue;const d=await getJson('./data/v4/'+shard.file);rows.push(...(Array.isArray(d.books)?d.books:[]))}const offset=start-first*index.shard_size;renderRows(rows.slice(offset,offset+(end-start)));const pages=Math.max(1,Math.ceil(index.total/pageSize));$('pager').innerHTML=`<button id="prev" ${page<=1?'disabled':''}>上一页</button><span>第 ${page} / ${pages} 页</span><button id="next" ${page>=pages?'disabled':''}>下一页</button>`;$('prev').onclick=()=>loadPage(page-1);$('next').onclick=()=>loadPage(page+1)}async function load(){try{$('status').className='';$('status').textContent='正在读取 v4 索引…';index=await getJson('./data/v4/index.json');$('count').textContent=Number(index.total||0)+' 本';$('updated').textContent=index.generated_at?'数据更新时间：'+index.generated_at:'尚无更新时间';const sc=index.source_counts||{};$('sources').textContent=Object.entries(sc).map(([k,v])=>k+' '+v+' 本').join(' · ');if(!index.total){$('status').className='';$('status').textContent='v4 索引已建立，但首批任务尚未写入小说。';renderRows([]);return}$('status').className='ok';$('status').textContent='v4 书库读取成功。';await loadPage(1)}catch(e){$('count').textContent='0 本';$('status').className='error';$('status').textContent='v4 数据尚未生成或部署未完成：'+(e?.message||'未知错误');$('updated').textContent='旧版空库已停止使用。';$('list').innerHTML='<section class="notice"><p>等待 v4 首批数据提交。页面会每分钟自动重试。</p></section>'}}$('reload').onclick=load;load();setInterval(load,60000)})();</script></body></html>

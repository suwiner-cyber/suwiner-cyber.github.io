<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小小说 · 全站索引库</title><style>body{font-family:system-ui,"PingFang SC";max-width:1100px;margin:auto;padding:28px;background:#f5f3ec;color:#1b2823}.top,.book-card{background:#fff;border:1px solid #e5e0d5;border-radius:18px;padding:18px;margin:12px 0}.book-card{display:grid;grid-template-columns:90px 1fr;gap:18px}img{width:90px;height:120px;object-fit:cover;border-radius:10px;background:#eee}p{color:#68736e;line-height:1.6}a{color:#176b55}.muted{color:#89938e}</style></head><body><section class="top"><h1>小小说 · 全站索引库</h1><p id="status">正在读取书库数据…</p><p class="muted">此页面会永久存在，即使爬虫暂时没有抓到数据也不会再 404。</p></section><main id="books"></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('data/full_catalog.json?ts='+Date.now()).then(r=>r.ok?r.json():Promise.reject()).then(d=>{const a=d.books||[];status.textContent='当前已索引 '+a.length+' 本';books.innerHTML=a.length?a.map(b=>`<article class="book-card"><img src="${esc(b.cover)}" loading="lazy"><div><h3>${esc(b.title)}</h3><p>${esc(b.author)} · ${esc(b.kind)} · ${esc(b.status)} · ${Number(b.chapter_count||0)}章/集</p><p>${esc(b.intro||'')}</p><a href="${esc(b.source_url)}" rel="nofollow">源站详情</a></div></article>`).join(''):'<section class="top"><p>书库暂时为空。请查看抓取状态和错误日志。</p></section>'}).catch(()=>{status.textContent='书库数据尚未生成';books.innerHTML='<section class="top"><p>爬虫首次成功运行后，这里会自动显示书籍。</p></section>'})</script></body></html>

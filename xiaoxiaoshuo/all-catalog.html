<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小小说 · 中文索引库</title><style>:root{--bg:#f5f3ec;--card:#fff;--ink:#1b2823;--muted:#68736e;--line:#e5e0d5;--green:#176b55}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:1180px;margin:auto;padding:24px;background:var(--bg);color:var(--ink)}.top,.book,.notice{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}.head{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.count{font-size:32px;font-weight:800;color:var(--green)}button{border:0;border-radius:12px;padding:10px 16px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.toolbar input{flex:1;min-width:220px;border:1px solid var(--line);border-radius:12px;padding:11px 13px}.book{display:grid;grid-template-columns:78px 1fr;gap:14px}.book img{width:78px;height:104px;object-fit:cover;border-radius:10px;background:#eee}.book h3{margin:0 0 7px}.meta,.muted{color:var(--muted)}a{color:var(--green);text-decoration:none}.read{display:inline-block;margin-top:7px;background:var(--green);color:white;padding:8px 12px;border-radius:9px}.pager{display:flex;gap:10px;justify-content:center;align-items:center;padding:18px}.error{color:#a33}.ok{color:var(--green)}.warn{color:#9a6500}@media(max-width:600px){body{padding:12px}.book{grid-template-columns:58px 1fr}.book img{width:58px;height:80px}}</style></head><body><section class="top"><div class="head"><div><h1>小小说 · 中文索引库</h1><div class="count" id="count">读取中…</div></div><button id="reload">刷新数据</button></div><div class="toolbar"><input id="search" placeholder="搜索书名 / 作者"><button id="searchBtn">搜索</button></div><p id="status">正在读取书库…</p><p class="muted" id="updated"></p><p class="muted" id="sources"></p></section><main id="list"><section class="notice"><p>正在连接书库数据。</p></section></main><div class="pager" id="pager"></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let idx=null,page=1,allCache=null,base='v5';const pageSize=80;async function j(u){const r=await fetch(u+(u.includes('?')?'&':'?')+'v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}function card(b){return `<article class="book"><img src="${esc(b.cover||'')}" loading="lazy" onerror="this.style.visibility='hidden'"><div><h3>${esc(b.title||'未命名')}</h3><p class="meta">${esc(b.author||'未知作者')} · ${esc(b.kind||'未分类')} · ${esc(b.status||'')} · ${Number(b.chapter_count||0)}章/集 · ${esc(b.source_name||'')}</p><p>${esc(b.intro||'')}</p><a class="read" href="./reader.html?id=${encodeURIComponent(b.id||'')}&base=${base}">在线阅读</a> ${b.source_url?`<a href="${esc(b.source_url)}" target="_blank" rel="nofollow noopener">源站详情</a>`:''}</div></article>`}function render(rows){$('list').innerHTML=rows.length?rows.map(card).join(''):'<section class="notice"><p>这一页没有匹配的中文小说。</p></section>'}async function shard(i){const s=idx.shards[i];return s?j('./data/'+base+'/'+s.file):{books:[]}}async function loadPage(p){page=Math.max(1,p);if(!idx||!idx.total){render([]);return}const start=(page-1)*pageSize,end=Math.min(idx.total,start+pageSize);if(start>=idx.total){page=1;return loadPage(1)}const first=Math.floor(start/idx.shard_size),last=Math.floor((end-1)/idx.shard_size),rows=[];for(let i=first;i<=last;i++){const d=await shard(i);rows.push(...(d.books||[]))}const off=start-first*idx.shard_size;render(rows.slice(off,off+(end-start)));const pages=Math.max(1,Math.ceil(idx.total/pageSize));$('pager').innerHTML=`<button id="prev" ${page<=1?'disabled':''}>上一页</button><span>第 ${page} / ${pages} 页</span><button id="next" ${page>=pages?'disabled':''}>下一页</button>`;$('prev').onclick=()=>loadPage(page-1);$('next').onclick=()=>loadPage(page+1)}async function search(){const q=$('search').value.trim().toLowerCase();if(!q)return loadPage(1);if(!allCache){allCache=[];for(let i=0;i<(idx.shards||[]).length;i++){const d=await shard(i);allCache.push(...(d.books||[]))}}render(allCache.filter(b=>((b.title||'')+' '+(b.author||'')).toLowerCase().includes(q)).slice(0,300));$('pager').innerHTML='<span>最多显示前 300 条匹配结果</span>'}async function chooseIndex(){try{const x=await j('./data/v5/index.json');if(Number(x.total||0)>0){base='v5';return x}}catch(e){}const x=await j('./data/v4/index.json');base='v4';return x}async function load(){try{$('status').className='';$('status').textContent='正在读取书库…';idx=await chooseIndex();$('count').textContent=Number(idx.total||0)+' 本';$('updated').textContent=idx.generated_at?'数据更新时间：'+idx.generated_at:'';$('sources').textContent=Object.entries(idx.source_counts||{}).map(([k,v])=>k+' '+v+' 本').join(' · ');if(base==='v5'){$('status').className='ok';$('status').textContent='中文过滤、跨来源去重 v5 已启用。'}else{$('status').className='warn';$('status').textContent='v5 正在构建，当前自动显示已有 v4 中文书库，数据不会归零。'}allCache=null;await loadPage(1)}catch(e){$('count').textContent='读取失败';$('status').className='error';$('status').textContent='v5 与 v4 均读取失败：'+e.message;render([])}}$('reload').onclick=load;$('searchBtn').onclick=search;$('search').onkeydown=e=>{if(e.key==='Enter')search()};load();setInterval(load,60000)})();</script></body></html>

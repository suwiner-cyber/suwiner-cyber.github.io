<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小小说 · 中央书库</title><style>:root{--bg:#f4f2ec;--paper:#fff;--ink:#1e2924;--muted:#77807b;--line:#e8e4db;--green:#176b55;--soft:#eef6f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px 14px 60px}.hero{background:linear-gradient(135deg,#124f40,#1d755f);color:#fff;border-radius:24px;padding:25px;margin-bottom:14px}.hero h1{margin:0;font-size:27px}.hero p{margin:8px 0 0;color:#d6e9e2}.count{font-size:36px;font-weight:850;margin-top:13px}.toolbar{display:flex;gap:8px;margin-top:16px}.toolbar input{min-width:0;flex:1;border:0;border-radius:12px;padding:12px 13px}.toolbar button,.chip,.pager button{border:0;border-radius:12px;padding:10px 13px;cursor:pointer}.toolbar button,.pager button{background:#fff;color:var(--green);font-weight:750}.categories{display:flex;gap:7px;overflow:auto;padding:4px 1px 14px}.chip{white-space:nowrap;background:#fff;color:#4d5b55;border:1px solid var(--line)}.chip.active{background:var(--green);color:#fff;border-color:var(--green)}.subbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:0 3px 12px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.book{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:82px minmax(0,1fr);gap:13px}.book.live{border-color:#b7d7cb;background:linear-gradient(180deg,#fff,#f7fbf9)}.coverbox{width:82px;height:116px;border-radius:11px;overflow:hidden;position:relative;background:#e4eee8}.coverbox img{width:100%;height:100%;object-fit:cover;position:relative;z-index:2}.fallback{position:absolute;inset:0;padding:12px 9px;background:linear-gradient(155deg,#1d705b,#123f35);color:#fff;font-size:13px;display:flex;align-items:center}.book h3{margin:1px 0 6px;font-size:16px}.meta{font-size:11px;color:var(--muted);line-height:1.55}.intro{font-size:12px;line-height:1.7;color:#535e58;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.actions{display:flex;gap:10px;align-items:center;margin-top:7px}.read{background:var(--green);color:#fff;text-decoration:none;padding:7px 10px;border-radius:9px;font-size:11px}.source{color:var(--green);font-size:11px;text-decoration:none}.tag{display:inline-block;font-size:10px;background:var(--soft);color:var(--green);border-radius:999px;padding:3px 7px;margin-left:6px}.pager{display:flex;gap:9px;justify-content:center;align-items:center;padding:22px;color:var(--muted)}.pager button{background:var(--green);color:#fff}.empty{grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:18px;padding:40px;text-align:center;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}}@media(max-width:480px){.wrap{padding:11px 8px 50px}.hero{padding:20px}.book{grid-template-columns:70px minmax(0,1fr)}.coverbox{width:70px;height:99px}.intro{-webkit-line-clamp:2}}</style></head><body><div class="wrap"><section class="hero"><h1 id="heading">小小说 · 中央书库</h1><p>优先读取自己的中央书库；本地未收录时自动补搜授权书源。</p><div class="count" id="count">读取中…</div><div class="toolbar"><input id="search" placeholder="搜索书名、作者、分类"><button id="searchBtn">搜索</button><button id="reload">刷新</button></div></section><div class="categories" id="categories"></div><div class="subbar"><span id="status">正在连接书库…</span><span id="sources"></span></div><main class="grid" id="list"></main><div class="pager" id="pager"></div></div><script>(()=>{'use strict';const EDGE='https://cgjwbyvebzstiucmuyou.supabase.co/functions/v1/xiaoxiaoshuo-reader';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const params=new URLSearchParams(location.search);let category=params.get('category')||'全部',query=params.get('q')||'';let idx=null,page=1,rows=[],pageSize=60;const cats=['全部','玄幻','都市','仙侠','武侠','历史','军事','科幻','悬疑','言情','校园','游戏','体育','轻小说','同人','完本','新书'];const aliases={玄幻:['玄幻','奇幻','魔法'],都市:['都市','职场','生活'],仙侠:['仙侠','修仙','修真'],武侠:['武侠'],历史:['历史','古代','穿越','架空'],军事:['军事','战争'],科幻:['科幻','末世','星际'],悬疑:['悬疑','推理','灵异','无限'],言情:['言情','爱情','女频','婚恋'],校园:['校园','青春'],游戏:['游戏','网游'],体育:['体育','竞技'],轻小说:['轻小说','日常'],同人:['同人']};async function j(u){const r=await fetch(u+(u.includes('?')?'&':'?')+'v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}function norm(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[\s\p{P}\p{S}]+/gu,'')}function textOf(b){return [b.title,b.author,b.kind,b.intro,b.status,b.source_name].filter(Boolean).join(' ')}function categoryMatch(b){if(category==='全部'||category==='新书')return true;if(category==='完本')return /完结|完本/.test(b.status||'');const a=aliases[category]||[category],t=textOf(b).toLowerCase();return a.some(x=>t.includes(x.toLowerCase()))}function score(b){if(!query)return 1;const q=norm(query),title=norm(b.title),author=norm(b.author),kind=norm(b.kind),intro=norm(b.intro);if(!q)return 1;if(title===q)return 100000;if(title.startsWith(q))return 90000-q.length;if(title.includes(q))return 80000-q.length;if(q.includes(title)&&title.length>=2)return 70000-title.length;if(author===q)return 60000;if(author.includes(q))return 50000;if(kind.includes(q))return 30000;if(intro.includes(q))return 10000;const parts=query.trim().split(/\s+/).map(norm).filter(Boolean);if(parts.length>1&&parts.every(x=>(title+author+kind+intro).includes(x)))return 5000;return 0}function match(b){return categoryMatch(b)&&(!query||score(b)>0)}function cover(b){const src=b.cover||'';return `<div class="coverbox"><div class="fallback">${esc((b.title||'小小说').slice(0,12))}</div>${src?`<img src="${esc(src)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</div>`}function readerHref(b){if(b.live_source&&b.source_url){const u=new URL('./reader.html',location.href);u.searchParams.set('source',b.source_url);u.searchParams.set('title',b.title||'');u.searchParams.set('author',b.author||'');u.searchParams.set('kind',b.kind||'');u.searchParams.set('cover',b.cover||'');return u.pathname+u.search}return `./reader.html?id=${encodeURIComponent(b.id||'')}&base=v5`}function card(b){return `<article class="book ${b.live_source?'live':''}">${cover(b)}<div><h3>${esc(b.title||'未命名')}${b.live_source?'<span class="tag">书源补搜</span>':''}</h3><div class="meta">${esc(b.author||'未知作者')} · ${esc(b.status||'')}${b.chapter_count?` · ${Number(b.chapter_count)}章`:''}</div><div class="meta">${esc((b.kind||'未分类').replace(/^首页\s*>\s*/,''))}</div><p class="intro">${esc(b.intro||'暂无简介')}</p><div class="actions"><a class="read" href="${esc(readerHref(b))}">开始阅读</a>${b.source_url?`<a class="source" href="${esc(b.source_url)}" target="_blank" rel="nofollow noopener">来源</a>`:''}</div></div></article>`}function render(){const pages=Math.max(1,Math.ceil(rows.length/pageSize));page=Math.min(Math.max(1,page),pages);const slice=rows.slice((page-1)*pageSize,page*pageSize);$('list').innerHTML=slice.length?slice.map(card).join(''):'<div class="empty">没有找到匹配小说。</div>';$('pager').innerHTML=rows.length>pageSize?`<button id="prev">上一页</button><span>${page} / ${pages}</span><button id="next">下一页</button>`:'';if($('prev'))$('prev').onclick=()=>{page--;render();scrollTo(0,0)};if($('next'))$('next').onclick=()=>{page++;render();scrollTo(0,0)}}function chips(){$('categories').innerHTML=cats.map(c=>`<button class="chip ${c===category?'active':''}" data-c="${c}">${c}</button>`).join('');$('categories').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;const u=new URL(location.href);if(b.dataset.c==='全部')u.searchParams.delete('category');else u.searchParams.set('category',b.dataset.c);if(query)u.searchParams.set('q',query);location.href=u.toString()}}async function sourceSearch(){if(!query)return[];try{const r=await fetch(EDGE+'?mode=search&q='+encodeURIComponent(query),{cache:'no-store'});if(!r.ok)return[];const d=await r.json();return Array.isArray(d.results)?d.results:[]}catch{return[]}}function dedupe(arr){const m=new Map();for(const b of arr){const k=norm(b.title)+'|'+norm(b.author);if(!k||k==='|')continue;const old=m.get(k);if(!old||score(b)>score(old))m.set(k,b)}return [...m.values()]}async function load(){try{chips();$('search').value=query;$('heading').textContent=category==='全部'?'小小说 · 中央书库':`小小说 · ${category}`;$('status').textContent=query?'正在全库精确搜索…':'正在读取自己的中央书库…';idx=await j('./data/v5/index.json');$('count').textContent=Number(idx.total||0).toLocaleString()+' 本';$('sources').textContent='书库更新 '+String(idx.generated_at||'').replace('T',' ').slice(0,16);rows=[];const shards=idx.shards||[];const max=(query||category!=='全部')?shards.length:Math.min(3,shards.length);for(let i=0;i<max;i++){const d=await j('./data/v5/'+shards[i].file);for(const b of(d.books||[]))if(match(b))rows.push(b)}if(query){rows.sort((a,b)=>score(b)-score(a));const live=await sourceSearch();rows=dedupe([...rows,...live.filter(categoryMatch)]);rows.sort((a,b)=>score(b)-score(a))}if(category==='新书'&&!query)rows=rows.slice(0,600);$('status').textContent=query?`搜索“${query}”共 ${rows.length.toLocaleString()} 本 · 标题精确匹配优先 · 已启用书源补搜`:`${category==='全部'?'推荐':'分类'}结果 ${rows.length.toLocaleString()} 本 · 中央书库优先`;page=1;render()}catch(e){$('count').textContent='读取失败';$('status').textContent=e.message;$('list').innerHTML='<div class="empty">书库连接失败，请稍后重试。</div>'}}$('searchBtn').onclick=()=>{const u=new URL(location.href),q=$('search').value.trim();q?u.searchParams.set('q',q):u.searchParams.delete('q');location.href=u.toString()};$('search').onkeydown=e=>{if(e.key==='Enter')$('searchBtn').click()};$('reload').onclick=load;load()})();</script></body></html>

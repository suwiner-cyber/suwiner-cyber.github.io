<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小小说 · 中文全本书库</title><style>:root{--bg:#f4f2ec;--paper:#fff;--ink:#1e2924;--muted:#77807b;--line:#e8e4db;--green:#176b55;--soft:#eef6f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1240px;margin:auto;padding:30px 22px 70px}.hero{background:linear-gradient(135deg,#124f40,#1d755f);color:white;border-radius:26px;padding:30px;box-shadow:0 18px 55px rgba(21,73,57,.12);margin-bottom:18px}.hero h1{margin:0;font-size:31px}.hero p{color:#cfe4dc}.count{font-size:42px;font-weight:850;margin-top:16px}.toolbar{display:flex;gap:10px;margin-top:18px}.toolbar input{flex:1;border:0;border-radius:13px;padding:13px 15px;outline:none}.toolbar button,.pager button{border:0;border-radius:12px;padding:11px 16px;background:white;color:var(--green);font-weight:750;cursor:pointer}.subbar{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;padding:5px 4px 12px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.book{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;grid-template-columns:94px minmax(0,1fr);gap:15px;box-shadow:0 8px 26px rgba(38,46,41,.035)}.coverbox{width:94px;height:132px;border-radius:13px;overflow:hidden;position:relative;background:linear-gradient(145deg,#dfece6,#f4efe1);box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}.coverbox img{width:100%;height:100%;display:block;object-fit:cover;position:relative;z-index:2}.fallback{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:13px 10px;background:linear-gradient(155deg,#1d705b,#123f35);color:white}.fallback:after{content:"";position:absolute;width:65px;height:65px;border:13px solid rgba(255,255,255,.06);border-radius:50%;right:-22px;bottom:-20px}.fallback strong{font-family:"Songti SC","STSong",serif;font-size:15px;line-height:1.45;position:relative;z-index:1}.fallback small{opacity:.65;position:relative;z-index:1}.book h3{margin:2px 0 7px;font-size:18px}.meta{font-size:12px;color:var(--muted);line-height:1.7}.intro{font-size:13px;line-height:1.75;color:#515b56;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.actions{display:flex;gap:12px;align-items:center;margin-top:9px}.read{background:var(--green);color:white;text-decoration:none;padding:8px 12px;border-radius:10px;font-size:12px;font-weight:750}.source{color:var(--green);font-size:12px;text-decoration:none}.pager{display:flex;gap:10px;justify-content:center;align-items:center;padding:24px;color:var(--muted)}.pager button{background:var(--green);color:white}.empty{background:#fff;border:1px solid var(--line);border-radius:18px;padding:45px;text-align:center;color:var(--muted)}@media(max-width:820px){.grid{grid-template-columns:1fr}}@media(max-width:560px){.wrap{padding:15px 10px 55px}.hero{padding:22px}.book{grid-template-columns:72px minmax(0,1fr)}.coverbox{width:72px;height:102px}.intro{-webkit-line-clamp:2}}</style></head><body><div class="wrap"><section class="hero"><h1>小小说 · 中文全本书库</h1><p>13 个授权纯文本书源 · 完整目录优先 · 本地缓存与实时章节双通道</p><div class="count" id="count">读取中…</div><div class="toolbar"><input id="search" placeholder="搜索书名或作者"><button id="searchBtn">搜索</button><button id="reload">刷新</button></div></section><div class="subbar"><span id="status">正在读取书库…</span><span id="sources"></span></div><main class="grid" id="list"></main><div class="pager" id="pager"></div></div><script>(()=>{'use strict';const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let idx=null,base='v5',page=1,allCache=null;const pageSize=60;async function j(u){const r=await fetch(u+(u.includes('?')?'&':'?')+'v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}function cover(b){const src=b.cover||'';return `<div class="coverbox"><div class="fallback"><strong>${esc((b.title||'小小说').slice(0,12))}</strong><small>${esc((b.author||'').slice(0,8)||'中文小说')}</small></div>${src?`<img src="${esc(src)}" alt="${esc(b.title||'小说封面')}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</div>`}function card(b){return `<article class="book">${cover(b)}<div><h3>${esc(b.title||'未命名')}</h3><div class="meta">${esc(b.author||'未知作者')} · ${esc(b.kind||'未分类')} · ${esc(b.status||'')} · ${Number(b.chapter_count||0)} 章 · ${esc(b.source_name||'')}</div><p class="intro">${esc(b.intro||'暂无简介')}</p><div class="actions"><a class="read" href="./reader.html?id=${encodeURIComponent(b.id||'')}&base=${base}">开始阅读</a>${b.source_url?`<a class="source" href="${esc(b.source_url)}" target="_blank" rel="nofollow noopener">源站</a>`:''}</div></div></article>`}function render(rows){$('list').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">没有匹配的小说。</div>'}async function shard(i){const s=idx.shards[i];return s?j('./data/'+base+'/'+s.file):{books:[]}}async function loadPage(p){page=Math.max(1,p);const start=(page-1)*pageSize,end=Math.min(Number(idx.total||0),start+pageSize);if(start>=idx.total){page=1;return loadPage(1)}const first=Math.floor(start/idx.shard_size),last=Math.floor((end-1)/idx.shard_size),rows=[];for(let i=first;i<=last;i++){const d=await shard(i);rows.push(...(d.books||[]))}render(rows.slice(start-first*idx.shard_size,start-first*idx.shard_size+(end-start)));const pages=Math.max(1,Math.ceil(idx.total/pageSize));$('pager').innerHTML=`<button id="prev" ${page<=1?'disabled':''}>上一页</button><span>第 ${page} / ${pages} 页</span><button id="next" ${page>=pages?'disabled':''}>下一页</button>`;$('prev').onclick=()=>loadPage(page-1);$('next').onclick=()=>loadPage(page+1)}async function search(){const q=$('search').value.trim().toLowerCase();if(!q)return loadPage(1);if(!allCache){allCache=[];for(let i=0;i<(idx.shards||[]).length;i++){const d=await shard(i);allCache.push(...(d.books||[]))}}const rows=allCache.filter(b=>((b.title||'')+' '+(b.author||'')).toLowerCase().includes(q)).slice(0,300);render(rows);$('pager').innerHTML='<span>最多显示前 300 条匹配结果</span>'}async function choose(){try{const x=await j('./data/v5/index.json');if(Number(x.total||0)>0){base='v5';return x}}catch{}base='v4';return j('./data/v4/index.json')}async function load(){try{$('status').textContent='正在读取书库…';idx=await choose();$('count').textContent=Number(idx.total||0).toLocaleString()+' 本';$('sources').textContent=Object.entries(idx.source_counts||{}).slice(0,8).map(([k,v])=>k+' '+v).join(' · ');$('status').textContent='书库已连接 · 真实封面持续回填 · 缺失章节可实时读取';allCache=null;await loadPage(1)}catch(e){$('count').textContent='读取失败';$('status').textContent=e.message;render([])}}$('reload').onclick=load;$('searchBtn').onclick=search;$('search').onkeydown=e=>{if(e.key==='Enter')search()};load()})();</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#1e1d1b;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}body{padding:1px 2px 10px}.card{background:rgba(255,255,255,.97);border:1px solid #f0ede7;border-radius:22px;box-shadow:0 9px 30px rgba(99,78,53,.055)}.rankCard{padding:15px 9px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid #f1eee8;margin-bottom:13px}.tab{position:relative;text-align:center;padding:2px 0 12px;font-size:13px;color:#9b9892;font-weight:650}.tab.active{font-size:15px;color:#84552f;font-weight:850}.tab.active:after{content:"";position:absolute;left:32%;right:32%;bottom:-1px;height:3px;border-radius:8px;background:#a56d36}.rankgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:7px;row-gap:13px}.rankbook{display:grid;grid-template-columns:13px 36px minmax(86px,1fr);gap:5px;align-items:center;min-width:0;min-height:56px;text-decoration:none;color:inherit}.num{font-size:13px;text-align:center;font-weight:850;color:#77736e}.num.first{font-size:15px;color:#c58b48}.cover{width:36px;height:50px;border-radius:8px;overflow:hidden;position:relative;background:#f6f0e7}.cover img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:3}.fallback{position:absolute;inset:0;background:#f8f3ea;overflow:hidden}.fallback:before{content:"";position:absolute;left:6px;right:6px;top:6px;height:24px;border:2px solid #fff;background:linear-gradient(180deg,#e8f3f0 0 58%,#c8ddd4 59% 100%);box-shadow:inset 0 -5px 0 rgba(173,137,96,.18)}.fallback:after{content:"";position:absolute;left:6px;right:6px;bottom:6px;height:12px;border-radius:50% 50% 12% 12%;background:linear-gradient(90deg,#fffdf8 0 49%,#eee1d1 50% 100%);border-bottom:2px solid #c79c79}.info{min-width:0;overflow:hidden;text-align:left}.name{margin:0;font-size:14px;line-height:1.28;font-weight:820;letter-spacing:0;word-spacing:0;text-align:left;white-space:normal;word-break:normal;line-break:strict;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;min-height:36px}.meta{display:flex;align-items:center;justify-content:flex-start;gap:4px;margin-top:4px;min-width:0;overflow:hidden;text-align:left}.heat{font-size:8.8px;color:#a8753f;white-space:nowrap}.tag{font-size:8.2px;color:#8a7560;background:#f5efe6;border-radius:999px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:54px}.categoryCard{margin-top:12px;padding:14px 13px}.categoryHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.categoryTitle{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:850}.categoryMark{color:#ad7c45;font-size:17px}.categorySub{font-size:9.5px;color:#aaa69f}.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cat{height:52px;border-radius:13px;background:linear-gradient(135deg,#faf8f4,#f4f0e9);display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:#292825;font-size:12px;font-weight:650}.catIcon{width:22px;text-align:center;color:#b78b59;font-size:18px;font-family:serif}.foot{text-align:center;color:#aaa69f;font-size:8.8px;line-height:1.5;margin-top:10px}.loading{grid-column:1/-1;text-align:center;color:#99958f;padding:28px 4px;font-size:11px}</style></head><body><section class="card rankCard"><div class="tabs" id="tabs"></div><div class="rankgrid" id="rankgrid"><div class="loading">正在读取推荐榜单…</div></div></section><section class="card categoryCard"><div class="categoryHead"><div class="categoryTitle"><span class="categoryMark">▦</span>小说分类</div><div class="categorySub">智能匹配有效外部书源 ›</div></div><div class="categories" id="categories"></div><div class="foot" id="foot">榜单仅用于发现好书 · 阅读时由小小说重新匹配有效书源</div></section><script>(()=>{'use strict';const RANKS=['推荐榜','完本榜','巅峰榜','新书榜'];const CATS=[['玄幻','◆'],['都市','▥'],['仙侠','♢'],['武侠','⌁'],['历史','▤'],['科幻','◌'],['悬疑','◎'],['言情','♧'],['游戏','⌘'],['同人','★'],['完本','▣'],['新书','▧']];const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const title=s=>String(s??'').replace(/[\s\u00A0\u200B\u3000\uFEFF]+/g,'').trim();const native=t=>`xiaoxiaoshuo://search?title=${encodeURIComponent(title(t))}`;let data=null,current='推荐榜';async function j(u){const r=await fetch(u+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}function heat(b,i){const r=Math.max(1,Number(b.rank||i+1));const words=Math.min(3,Number(b.word_count||0)/5000000);return Math.max(72,99.8-(r-1)*2.15+words).toFixed(1)}function renderTabs(){document.getElementById('tabs').innerHTML=RANKS.map(x=>`<span class="tab ${x===current?'active':''}" data-rank="${x}">${x}</span>`).join('');document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{current=x.dataset.rank;renderTabs();renderRank()})}function card(b,i){const n=Number(b.rank||i+1),t=title(b.title),cover=b.cover?`<img src="${e(b.cover)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:'';return `<a class="rankbook" href="${native(t)}"><div class="num ${n===1?'first':''}">${n}</div><div class="cover"><div class="fallback"></div>${cover}</div><div class="info"><div class="name">${e(t)}</div><div class="meta"><span class="heat">热度 ${heat(b,i)}</span><span class="tag">${e(b.category||'热门')}</span></div></div></a>`}function renderRank(){const src=data?.rankings?.[current]||data?.featured||[];const rows=src.filter(b=>{const t=title(b?.title);return t.length>=2&&t!=='未知'&&t!=='未命名'}).slice(0,8);document.getElementById('rankgrid').innerHTML=rows.length?rows.map(card).join(''):'<div class="loading">榜单正在整理，稍后自动恢复。</div>'}function renderCats(){document.getElementById('categories').innerHTML=CATS.map(([n,ic])=>`<a class="cat" href="${native(n)}"><span class="catIcon">${ic}</span><span>${n}</span></a>`).join('')}async function run(){renderTabs();renderCats();try{data=await j('./data/recommendations.json');renderRank();if(data.generated_at){const d=new Date(data.generated_at);document.getElementById('foot').textContent=`榜单约每12小时整理 · ${d.toLocaleString('zh-CN',{hour12:false})} · 正文由客户端原生阅读器排版`}}catch(err){renderRank()}}run()})();</script></body></html>

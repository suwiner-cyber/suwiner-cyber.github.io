<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#1e1d1b;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}body{padding:1px 2px 14px}.card{background:rgba(255,255,255,.97);border:1px solid #f0ede7;border-radius:22px;box-shadow:0 9px 30px rgba(99,78,53,.055)}.rankCard{padding:16px 14px 15px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);align-items:center;border-bottom:1px solid #f1eee8;margin-bottom:14px}.tab{position:relative;text-align:center;padding:1px 0 13px;font-size:14px;color:#9b9892;font-weight:650;cursor:pointer}.tab.active{font-size:16px;color:#84552f;font-weight:850}.tab.active:after{content:"";position:absolute;left:31%;right:31%;bottom:-1px;height:3px;border-radius:8px;background:#a56d36}.rankgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:18px;row-gap:11px}.rankbook{display:grid;grid-template-columns:27px 54px minmax(0,1fr);gap:8px;align-items:center;min-height:72px;text-decoration:none;color:inherit}.num{font-size:15px;text-align:center;font-weight:850;color:#77736e}.num.first{font-size:17px;color:#c58b48}.cover{width:54px;height:72px;border-radius:9px;overflow:hidden;position:relative;background:linear-gradient(150deg,#ceb99b,#8b7257)}.cover img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:2}.fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:6px;color:#fff;font-family:"Songti SC",serif;font-size:10px;text-align:center}.info{min-width:0}.name{font-size:13px;line-height:1.4;font-weight:780;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:9.5px;color:#b08b62;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.categoryCard{margin-top:12px;padding:14px 13px 14px}.categoryHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.categoryTitle{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:850}.categoryMark{color:#ad7c45;font-size:17px;letter-spacing:-2px}.categorySub{font-size:9.5px;color:#aaa69f}.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cat{height:52px;border-radius:13px;background:linear-gradient(135deg,#faf8f4,#f4f0e9);display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:#292825;font-size:12px;font-weight:650}.catIcon{width:22px;text-align:center;color:#b78b59;font-size:18px;font-family:serif}.cat:active{background:#efe7db}.foot{text-align:center;color:#aaa69f;font-size:8.8px;line-height:1.5;margin-top:10px}.loading{grid-column:1/-1;text-align:center;color:#99958f;padding:28px 4px;font-size:11px}</style></head><body><section class="card rankCard"><div class="tabs" id="tabs"></div><div class="rankgrid" id="rankgrid"><div class="loading">正在读取推荐榜单…</div></div></section><section class="card categoryCard"><div class="categoryHead"><div class="categoryTitle"><span class="categoryMark">▦</span>小说分类</div><div class="categorySub">智能匹配有效外部书源  ›</div></div><div class="categories" id="categories"></div><div class="foot" id="foot">榜单仅用于发现好书 · 阅读时由小小说重新匹配有效书源</div></section><script>(()=>{'use strict';const RANKS=['推荐榜','完本榜','巅峰榜','新书榜'];const CATS=[['玄幻','◆'],['都市','▥'],['仙侠','♢'],['武侠','⌁'],['历史','▤'],['科幻','◌'],['悬疑','◎'],['言情','♧'],['游戏','⌘'],['同人','★'],['完本','▣'],['新书','▧']];const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const native=t=>`xiaoxiaoshuo://search?title=${encodeURIComponent(t)}`;let data=null,current='推荐榜';async function j(u){const r=await fetch(u+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}function renderTabs(){document.getElementById('tabs').innerHTML=RANKS.map(x=>`<span class="tab ${x===current?'active':''}" data-rank="${x}">${x}</span>`).join('');document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{current=x.dataset.rank;renderTabs();renderRank()})}function card(b,i){const n=Number(b.rank||i+1),cover=b.cover?`<img src="${e(b.cover)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:'';return `<a class="rankbook" href="${native(b.title||'')}"><div class="num ${n===1?'first':''}">${n}</div><div class="cover"><div class="fallback">${e((b.title||'小说').slice(0,8))}</div>${cover}</div><div class="info"><div class="name">${e(b.title||'未命名')}</div><div class="meta">${e(b.category||'热门')} · ${e(b.author||'未知作者')}</div></div></a>`}function renderRank(){const rows=(data?.rankings?.[current]||data?.featured||[]).slice(0,8);document.getElementById('rankgrid').innerHTML=rows.length?rows.map(card).join(''):'<div class="loading">榜单正在整理，稍后自动恢复。</div>'}function renderCats(){document.getElementById('categories').innerHTML=CATS.map(([n,ic])=>`<a class="cat" href="${native(n)}"><span class="catIcon">${ic}</span><span>${n}</span></a>`).join('')}async function run(){renderTabs();renderCats();try{data=await j('./data/recommendations.json');renderRank();if(data.generated_at){const d=new Date(data.generated_at);document.getElementById('foot').textContent=`榜单约每12小时整理 · ${d.toLocaleString('zh-CN',{hour12:false})} · 正文由客户端原生阅读器排版`}}catch(err){renderRank()}}run()})();</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;background:#fbfaf6;color:#1f201f;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}body{padding:2px 1px 18px}.panel{background:#fff;border-radius:18px;padding:13px 12px 12px;border:1px solid #f1eee7}.tabs{display:flex;gap:22px;align-items:center;overflow-x:auto;white-space:nowrap;padding:3px 2px 12px}.tab{font-size:14px;color:#92918c;font-weight:650;cursor:pointer}.tab.active{font-size:17px;color:#171817;font-weight:850}.rankgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 15px}.rankbook{display:grid;grid-template-columns:28px 45px minmax(0,1fr);gap:7px;align-items:center;text-decoration:none;color:inherit;min-height:63px}.num{font-weight:850;font-size:15px;text-align:center}.num.hot{color:#d5a858}.cover{width:45px;height:59px;border-radius:7px;overflow:hidden;background:linear-gradient(155deg,#e9dcc7,#c5b091);position:relative}.cover img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:2}.fallback{position:absolute;inset:0;display:flex;align-items:center;padding:5px;font-family:"Songti SC",serif;font-size:9px;color:#fff}.info{min-width:0}.name{font-size:12px;font-weight:760;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:9px;color:#b38d50;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.divider{height:1px;background:#f0ede8;margin:14px 0 12px}.categoryHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.categoryTitle{font-size:15px;font-weight:850}.categorySub{font-size:9px;color:#989792}.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cat{display:block;text-align:center;text-decoration:none;color:#3c3b38;background:#f7f5ef;border-radius:12px;padding:10px 3px;font-size:11px}.cat:active{background:#efe7da}.foot{font-size:9px;color:#a5a39d;text-align:center;margin-top:10px;line-height:1.45}.loading{grid-column:1/-1;color:#999;padding:25px 4px;text-align:center;font-size:11px}</style></head><body><section class="panel"><div class="tabs" id="tabs"></div><div class="rankgrid" id="rankgrid"><div class="loading">正在读取推荐榜单…</div></div><div class="divider"></div><div class="categoryHead"><div class="categoryTitle">小说分类</div><div class="categorySub">智能匹配有效外部书源</div></div><div class="categories" id="categories"></div><div class="foot" id="foot">榜单只用于推荐；点击小说后由小小说重新搜索有效书源并用原生阅读器排版。</div></section><script>(()=>{'use strict';const RANKS=['推荐榜','完本榜','巅峰榜','新书榜'];const CATS=['玄幻','都市','仙侠','武侠','历史','科幻','悬疑','言情','游戏','同人','完本','新书'];const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const nativeBook=t=>`xiaoxiaoshuo://search?title=${encodeURIComponent(t)}`;const nativeCat=t=>`xiaoxiaoshuo://search?title=${encodeURIComponent(t)}`;let data=null,current='推荐榜';async function j(u){const r=await fetch(u+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}function renderTabs(){document.getElementById('tabs').innerHTML=RANKS.map(x=>`<span class="tab ${x===current?'active':''}" data-rank="${x}">${x}</span>`).join('');document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{current=x.dataset.rank;renderTabs();renderRank()})}function card(b,i){const cover=b.cover?`<img src="${e(b.cover)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:'';const n=Number(b.rank||i+1);return `<a class="rankbook" href="${nativeBook(b.title||'')}"><div class="num ${n<=3?'hot':''}">${n}</div><div class="cover"><div class="fallback">${e((b.title||'小说').slice(0,9))}</div>${cover}</div><div class="info"><div class="name">${e(b.title||'未命名')}</div><div class="meta">${e(b.category||'热门')} · ${e(b.author||'未知作者')}</div></div></a>`}function renderRank(){const rows=(data?.rankings?.[current]||data?.featured||[]).slice(0,8);document.getElementById('rankgrid').innerHTML=rows.length?rows.map(card).join(''):'<div class="loading">榜单正在整理，稍后自动恢复。</div>'}function renderCats(){document.getElementById('categories').innerHTML=CATS.map(x=>`<a class="cat" href="${nativeCat(x)}">${x}</a>`).join('')}async function run(){renderTabs();renderCats();try{data=await j('./data/recommendations.json');renderRank();if(data.generated_at){const d=new Date(data.generated_at);document.getElementById('foot').textContent=`榜单约每12小时整理 · ${d.toLocaleString('zh-CN',{hour12:false})} · 阅读时重新匹配有效外部书源`}}catch(err){renderRank()}}run()})();</script></body></html>

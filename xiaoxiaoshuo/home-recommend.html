<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#1f2b25;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}body{padding:4px 1px 8px}.metaTop{display:flex;justify-content:space-between;gap:8px;align-items:center;color:#7a827e;font-size:10px;padding:0 2px 8px}.wall{columns:2;column-gap:10px}.book{display:inline-block;width:100%;break-inside:avoid;margin:0 0 11px;text-decoration:none;color:inherit;border:1px solid #ece8df;border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 5px 18px rgba(35,51,43,.045)}.cover{width:100%;aspect-ratio:3/4;overflow:hidden;position:relative;background:linear-gradient(155deg,#176b55,#123f35)}.cover img{width:100%;height:100%;display:block;object-fit:cover;position:relative;z-index:2}.fallback{position:absolute;inset:0;padding:15px 12px;color:#fff;font-family:"Songti SC",serif;font-size:15px;line-height:1.55;display:flex;align-items:center}.info{padding:9px 9px 10px}.name{font-size:13px;font-weight:750;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.author{font-size:10px;color:#737d77;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tags{font-size:9px;color:#176b55;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.loading{column-span:all;font-size:12px;color:#7b837f;padding:24px 5px;text-align:center}.badge{font-size:9px;color:#176b55;background:#edf7f2;border-radius:999px;padding:4px 7px}</style></head><body><div class="metaTop"><span>中央书库实时匹配 · 热榜加权</span><span class="badge" id="count">加载中</span></div><main class="wall" id="wall"><div class="loading">正在读取你的书源并计算推荐…</div></main><script>(()=>{'use strict';const HOT=['无敌天命','剑来','太荒吞天诀','星辰大道','最强狂兵Ⅱ：黑暗荣耀','齐天','万仙来朝','鸿蒙霸体诀','逆天邪神','星辰之主','众仙俯首','封疆悍卒','盗梦千年','天黑请点灯','逍遥四公子','神通者'];const HOTAUTH=['青鸾峰上','烽火戏诸侯','铁马飞桥','随散飘风','烈焰滔滔','天蚕土豆'];const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function j(u){const r=await fetch(u+(u.includes('?')?'&':'?')+'v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}function score(b){const t=String(b.title||'').trim(),a=String(b.author||''),k=String(b.kind||''),st=String(b.status||'');let s=0;const i=HOT.indexOf(t);if(i>=0)s+=10000-i*180;for(let x=0;x<HOTAUTH.length;x++)if(a.includes(HOTAUTH[x]))s+=1800-x*80;if(b.cover)s+=700;if(b.detail_complete)s+=300;const c=Number(b.chapter_count||0);s+=Math.min(c,2500)*.22;if(/完结|完本/.test(st))s+=120;if(/玄幻|仙侠|都市|历史|科幻|悬疑|言情|游戏|武侠/.test(k))s+=80;const ts=Date.parse(b.indexed_at||'');if(Number.isFinite(ts))s+=Math.max(0,500-(Date.now()-ts)/86400000*8);return s}function card(b){const cover=b.cover?`<img src="${e(b.cover)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:'';const kind=String(b.kind||'').replace(/^首页\s*>\s*/,'').split('>').slice(-1)[0].trim();return `<a class="book" href="./reader.html?id=${encodeURIComponent(b.id)}&base=v5"><div class="cover"><div class="fallback">${e((b.title||'小小说').slice(0,16))}</div>${cover}</div><div class="info"><div class="name">${e(b.title||'未命名')}</div><div class="author">${e(b.author||'未知作者')}</div><div class="tags">${e(kind||b.status||'热门推荐')} · ${Number(b.chapter_count||0)}章</div></div></a>`}async function run(){try{const idx=await j('./data/v5/index.json');let books=[];const shards=(idx.shards||[]).slice(0,10);for(const s of shards){const d=await j('./data/v5/'+s.file);books.push(...(d.books||[]))}const seen=new Set;books=books.filter(b=>{if(!b||!b.id||!b.title||Number(b.chapter_count||0)<8)return false;const key=String(b.title).trim();if(seen.has(key))return false;seen.add(key);return true}).map(b=>({b,s:score(b)})).sort((x,y)=>y.s-x.s).slice(0,12).map(x=>x.b);document.getElementById('count').textContent='推荐 '+books.length+' 本';document.getElementById('wall').innerHTML=books.length?books.map(card).join(''):'<div class="loading">书库暂时没有可推荐小说</div>'}catch(err){document.getElementById('count').textContent='离线';document.getElementById('wall').innerHTML='<div class="loading">推荐加载失败，请稍后刷新。你的本地书架不受影响。</div>'}}run()})();</script></body></html>

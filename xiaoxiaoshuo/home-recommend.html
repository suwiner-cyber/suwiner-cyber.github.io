<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#1f2b25;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}body{padding:3px 1px 16px}.head{display:flex;justify-content:space-between;align-items:flex-end;padding:2px 2px 10px}.title{font-size:16px;font-weight:800}.sub{font-size:10px;color:#89908d;margin-top:3px}.badge{font-size:9px;color:#176b55;background:#edf7f2;border-radius:999px;padding:5px 8px}.wall{columns:2;column-gap:10px}.book{display:inline-block;width:100%;break-inside:avoid;margin:0 0 11px;text-decoration:none;color:inherit;border:1px solid #ece8df;border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 5px 18px rgba(35,51,43,.045)}.cover{width:100%;aspect-ratio:3/4;overflow:hidden;position:relative;background:linear-gradient(155deg,#176b55,#123f35)}.cover img{width:100%;height:100%;display:block;object-fit:cover;position:relative;z-index:2}.fallback{position:absolute;inset:0;padding:15px 12px;color:#fff;font-family:"Songti SC",serif;font-size:15px;line-height:1.55;display:flex;align-items:center}.info{padding:9px 9px 10px}.name{font-size:13px;font-weight:750;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.author{font-size:10px;color:#737d77;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tags{font-size:9px;color:#176b55;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.loading{column-span:all;font-size:12px;color:#7b837f;padding:24px 5px;text-align:center}.categoryBlock{margin-top:14px;padding:14px 2px 2px;border-top:1px solid #f0ede7}.categoryTitle{font-size:15px;font-weight:800;margin-bottom:10px}.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cat{display:block;text-align:center;text-decoration:none;color:#30413a;background:#f7f7f4;border:1px solid #eeece5;border-radius:12px;padding:11px 3px;font-size:12px}.cat:active{background:#edf7f2;color:#176b55}.note{font-size:9px;color:#9aa09d;margin-top:10px;line-height:1.55}</style></head><body><section class="head"><div><div class="title">精选推荐</div><div class="sub">来自已整理书源的推荐池</div></div><span class="badge" id="badge">加载中</span></section><main class="wall" id="wall"><div class="loading">正在读取推荐快照…</div></main><section class="categoryBlock"><div class="categoryTitle">小说分类</div><div class="categories" id="categories"></div><div class="note" id="note">推荐内容由服务器定时整理，打开首页时不会实时抓取外部网站。</div></section><script>(()=>{'use strict';const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const names=['玄幻','都市','仙侠','武侠','历史','科幻','悬疑','言情','游戏','轻小说','完本','全部'];async function j(u){const r=await fetch(u+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}function card(b){const cover=b.cover?`<img src="${e(b.cover)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:'';return `<a class="book" href="./reader.html?id=${encodeURIComponent(b.id)}&base=v5"><div class="cover"><div class="fallback">${e((b.title||'小小说').slice(0,16))}</div>${cover}</div><div class="info"><div class="name">${e(b.title||'未命名')}</div><div class="author">${e(b.author||'未知作者')}</div><div class="tags">${e(b.category||b.status||'推荐')} · ${Number(b.chapter_count||0)}章</div></div></a>`}function categories(data){const available=new Set(data.category_order||names);document.getElementById('categories').innerHTML=names.filter(x=>available.has(x)||x==='全部').map(c=>`<a class="cat" href="./all-catalog.html?category=${encodeURIComponent(c)}">${e(c)}</a>`).join('')}async function run(){try{const data=await j('./data/recommendations.json');const books=Array.isArray(data.featured)?data.featured:[];document.getElementById('wall').innerHTML=books.length?books.map(card).join(''):'<div class="loading">推荐池正在生成，请稍后刷新。</div>';document.getElementById('badge').textContent=books.length?`推荐 ${books.length} 本`:'准备中';categories(data);if(data.generated_at){const d=new Date(data.generated_at);document.getElementById('note').textContent=`推荐快照约每12小时更新 · 最近生成 ${d.toLocaleString('zh-CN',{hour12:false})}`}}catch(err){document.getElementById('badge').textContent='准备中';document.getElementById('wall').innerHTML='<div class="loading">推荐快照正在生成，稍后自动恢复。</div>';categories({category_order:names})}}run()})();</script></body></html>

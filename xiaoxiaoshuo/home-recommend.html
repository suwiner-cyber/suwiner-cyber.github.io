<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#1f2b25;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}body{padding:2px 0 0}.row{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}.book{flex:0 0 118px;text-decoration:none;color:inherit}.cover{width:86px;height:116px;border-radius:10px;overflow:hidden;background:linear-gradient(150deg,#1d705b,#17483d);box-shadow:0 4px 12px rgba(20,65,52,.12);position:relative}.cover img{width:100%;height:100%;display:block;object-fit:cover;position:relative;z-index:2}.fallback{position:absolute;inset:0;padding:10px 8px;color:#fff;font-family:"Songti SC",serif;font-size:13px;line-height:1.5;display:flex;align-items:center}.name{font-size:12px;font-weight:650;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:#7b837f;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.loading{font-size:12px;color:#7b837f;padding:15px 4px}</style></head><body><div class="row" id="row"><div class="loading">正在从中央书库读取推荐…</div></div><script>(()=>{'use strict';const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function j(u){const r=await fetch(u+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}async function run(){try{const idx=await j('./data/v5/index.json');const shards=(idx.shards||[]).slice(0,3);let books=[];for(const s of shards){const d=await j('./data/v5/'+s.file);books.push(...(d.books||[]))}books=books.filter(b=>b&&b.id&&b.title&&Number(b.chapter_count||0)>5).slice(0,12);document.getElementById('row').innerHTML=books.map(b=>`<a class="book" href="./reader.html?id=${encodeURIComponent(b.id)}&base=v5"><div class="cover"><div class="fallback">${e(b.title.slice(0,12))}</div>${b.cover?`<img src="${e(b.cover)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</div><div class="name">${e(b.title)}</div><div class="meta">${e(b.author||'未知作者')}</div></a>`).join('')||'<div class="loading">中央书库暂时没有推荐内容</div>'}catch(err){document.getElementById('row').innerHTML='<div class="loading">推荐加载失败，点击“全部”进入中央书库</div>'}}run()})();</script></body></html>

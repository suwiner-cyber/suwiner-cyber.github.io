<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小小说书库</title><style>body{font-family:system-ui,"Microsoft YaHei";max-width:900px;margin:40px auto;padding:0 18px;background:#f7f5ef;color:#20302a}.book-card{background:#fff;border:1px solid #e3ded2;border-radius:16px;padding:16px;margin:12px 0}.book-name{font-size:18px;font-weight:700}.book-author,.book-kind,.book-intro,.book-last{color:#66736d;margin-top:5px}a{color:#176b55}</style></head><body><h1>小小说中央书库</h1><p>手机端使用 catalog.html；此页面供人工浏览。</p><div id="books"></div><script>fetch('data/books.json?x='+Date.now()).then(r=>r.json()).then(d=>{books.innerHTML=(d.books||[]).map(b=>`<div class="book-card"><div class="book-name">${e(b.title)}</div><div class="book-author">${e(b.author||'')}</div><div class="book-kind">${e(b.kind||'')}</div><div class="book-intro">${e(b.intro||'')}</div><div class="book-last">${e(b.last_chapter||'')}</div><a href="${e(b.page)}">打开目录</a></div>`).join('')||'<p>书库目前为空。</p>'});function e(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>

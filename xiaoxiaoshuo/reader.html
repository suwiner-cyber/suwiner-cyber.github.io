<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小小说阅读器</title><style>:root{--bg:#f2f0e9;--paper:#fffdf8;--ink:#24231f;--muted:#7b756c;--line:#e6dfd2;--accent:#176b55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC","Songti SC","STSong",serif}.bar{position:sticky;top:0;z-index:20;background:rgba(255,253,248,.97);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar button,.bar a{border:0;border-radius:11px;padding:9px 13px;background:#eee8dd;color:#2b2823;text-decoration:none;cursor:pointer}.wrap{max-width:940px;margin:auto;padding:26px 18px 80px}.hero,.reader{background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:0 16px 45px rgba(45,36,20,.05)}.hero{padding:24px;margin-bottom:18px}.hero h1{margin:0 0 8px}.meta,.status{color:var(--muted);font-family:system-ui,sans-serif;font-size:13px}.reader{padding:clamp(24px,5vw,64px);min-height:72vh}.chapter-title{text-align:center;margin:0 0 34px}.content{font-size:20px;line-height:2;letter-spacing:.04em;white-space:pre-wrap}.empty{padding:48px 18px;text-align:center;color:var(--muted);line-height:1.9}.nav{display:flex;gap:12px;margin-top:28px}.nav button{flex:1;border:0;border-radius:13px;padding:13px;background:#eee8dd;cursor:pointer}.mask{position:fixed;inset:0;background:#0006;z-index:30;opacity:0;pointer-events:none;transition:.2s}.mask.show{opacity:1;pointer-events:auto}.drawer{position:fixed;left:0;top:0;bottom:0;width:min(500px,92vw);background:var(--paper);z-index:31;transform:translateX(-100%);transition:.22s;display:flex;flex-direction:column;box-shadow:18px 0 55px #0003}.drawer.show{transform:none}.drawer-head{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.drawer-list{overflow:auto;padding:8px}.drawer-list button{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 10px;color:var(--ink);cursor:pointer}.drawer-list button.active{background:#eee8dd}.drawer-list button.live{color:#8c6614}.drawer-list button.ready{color:var(--accent);font-weight:650}.drawer-list small{float:right}.dark{--bg:#181817;--paper:#242320;--ink:#e9e5dc;--muted:#aaa39a;--line:#383631;--accent:#67b69f}.sepia{--bg:#e8dfcb;--paper:#f5ecd9;--ink:#382f25;--muted:#786b59;--line:#d6c7ad}@media(max-width:640px){.wrap{padding:14px 10px 70px}.reader{padding:26px 18px}.content{font-size:18px}}</style></head><body><div class="bar"><a href="./all-catalog.html">← 返回书库</a><button id="tocBtn">完整目录</button><button id="smaller">A−</button><button id="bigger">A＋</button><button id="theme">护眼</button><button id="retry">刷新</button><span class="status" id="status">正在读取…</span></div><div class="mask" id="mask"></div><aside class="drawer" id="drawer"><div class="drawer-head"><div><b>完整章节目录</b><div class="status" id="tocStatus"></div></div><button id="close">×</button></div><div class="drawer-list" id="tocList"></div></aside><main class="wrap"><section class="hero"><h1 id="bookTitle">小小说阅读器</h1><div id="meta" class="meta"></div></section><section class="reader"><h2 id="chapterTitle" class="chapter-title"></h2><div id="content" class="content"><div class="empty">正在载入…</div></div><div class="nav"><button id="prev">上一章</button><button id="next">下一章</button></div></section></main><script>(()=>{'use strict';const EDGE='https://cgjwbyvebzstiucmuyou.supabase.co/functions/v1/xiaoxiaoshuo-reader';const $=x=>document.getElementById(x),q=new URLSearchParams(location.search),requestedId=q.get('id'),requestedBase=q.get('base');let book=null,bookBase='v5',activeId=requestedId,doc={chapters:[]},toc={chapters:[]},pos=0,size=20,theme=0,liveCache=new Map();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function j(u){const r=await fetch(u+(u.includes('?')?'&':'?')+'v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}async function edge(mode,url){const r=await fetch(EDGE+'?mode='+encodeURIComponent(mode)+'&url='+encodeURIComponent(url),{cache:'no-store'});if(!r.ok)throw Error('实时读取失败');return r.json()}async function findIn(base){try{const idx=await j('./data/'+base+'/index.json');for(const s of idx.shards||[]){const d=await j('./data/'+base+'/'+s.file);const b=(d.books||[]).find(x=>x.id===requestedId);if(b)return b}}catch(e){}return null}async function loadJson(path){try{return await j(path)}catch{return null}}function k(x){return x?.url||('n:'+x?.n)}function localMap(){const m=new Map();(doc.chapters||[]).forEach(x=>m.set(k(x),x));return m}async function chooseLocal(){const ids=[requestedId,...(book.read_ids||[])].filter((v,i,a)=>v&&a.indexOf(v)===i);let best={id:requestedId,toc:{chapters:[]},doc:{chapters:[]},score:-1};for(const id of ids){const td=await loadJson('./data/v5/toc/'+encodeURIComponent(id)+'.json')||{chapters:[]};const cd=await loadJson('./data/v5/chapters/'+encodeURIComponent(id)+'.json')||{chapters:[]};const score=(td.chapters?.length||0)*100000+(cd.chapters?.length||0);if(score>best.score)best={id,toc:td,doc:cd,score}}activeId=best.id;toc=best.toc;doc=best.doc}async function ensureFullToc(){const localCount=toc.chapters?.length||0;if(localCount>3)return;const candidates=[...(book.read_sources||[]),book.source_url].filter(Boolean);for(const u of candidates){try{const d=await edge('toc',u);if((d.chapters?.length||0)>localCount){toc={book_id:activeId,title:book.title,chapters:d.chapters,live:true};return}}catch(e){}}if(!localCount)toc={chapters:(doc.chapters||[]).map(x=>({n:x.n,title:x.title,url:x.url}))}}async function getChapter(item){const m=localMap(),local=m.get(k(item));if(local?.content)return {...local,mode:'local'};if(liveCache.has(item.url))return liveCache.get(item.url);if(!item.url)throw Error('章节地址不存在');const d=await edge('chapter',item.url);const x={n:item.n,title:d.title||item.title,url:item.url,content:d.content,mode:'live'};liveCache.set(item.url,x);return x}function renderToc(){const m=localMap(),rows=toc.chapters||[];$('tocStatus').textContent=`目录 ${rows.length} 章 · 本地 ${doc.chapters?.length||0} 章 · 其余按需实时读取`;$('tocList').innerHTML=rows.map((x,i)=>{const ready=m.has(k(x)),live=!ready&&liveCache.has(x.url);return `<button data-i="${i}" class="${i===pos?'active ':''}${ready?'ready':live?'live':''}">${esc(x.title||('第'+(x.n||i+1)+'章'))}<small>${ready?'已缓存':live?'已读取':'可在线读取'}</small></button>`}).join('')||'<div class="empty">正在发现完整目录…</div>';$('tocList').querySelectorAll('button').forEach(b=>b.onclick=async()=>{pos=+b.dataset.i;closeDrawer();await show()})}async function show(){const rows=toc.chapters||[];if(!rows.length){$('chapterTitle').textContent='目录读取中';$('content').innerHTML='<div class="empty">正在从授权源站生成完整目录。</div>';return}pos=Math.max(0,Math.min(pos,rows.length-1));const t=rows[pos];$('chapterTitle').textContent=t.title||('第'+(t.n||pos+1)+'章');$('content').innerHTML='<div class="empty">正在读取本章正文…</div>';try{const c=await getChapter(t);$('content').textContent=c.content||'';$('status').textContent=`完整目录 ${rows.length} 章 · 当前第 ${pos+1} 章 · ${c.mode==='local'?'本地缓存':'实时读取'}`}catch(e){$('content').innerHTML='<div class="empty">本章当前无法公开读取。后台仍会继续缓存可访问正文。</div>'}$('prev').disabled=pos===0;$('next').disabled=pos===rows.length-1;localStorage.setItem('xxs-pos:'+requestedId,String(pos));renderToc();scrollTo({top:0,behavior:'smooth'})}function openDrawer(){$('drawer').classList.add('show');$('mask').classList.add('show');renderToc()}function closeDrawer(){$('drawer').classList.remove('show');$('mask').classList.remove('show')}async function load(){try{$('status').textContent='正在读取书籍与完整目录…';for(const b of (requestedBase==='v4'?['v4','v5']:['v5','v4'])){book=await findIn(b);if(book){bookBase=b;break}}if(!book)throw Error('书籍索引不存在');$('bookTitle').textContent=book.title||'未命名';$('meta').textContent=[book.author,book.kind,book.status,book.source_name].filter(Boolean).join(' · ');await chooseLocal();await ensureFullToc();pos=+(localStorage.getItem('xxs-pos:'+requestedId)||0);await show()}catch(e){$('status').textContent='读取失败';$('content').innerHTML='<div class="empty">'+esc(e.message||e)+'</div>'}}$('prev').onclick=async()=>{if(pos>0){pos--;await show()}};$('next').onclick=async()=>{if(pos<(toc.chapters||[]).length-1){pos++;await show()}};$('tocBtn').onclick=openDrawer;$('close').onclick=closeDrawer;$('mask').onclick=closeDrawer;$('retry').onclick=load;$('bigger').onclick=()=>{$('content').style.fontSize=(size=Math.min(30,size+1))+'px'};$('smaller').onclick=()=>{$('content').style.fontSize=(size=Math.max(14,size-1))+'px'};$('theme').onclick=()=>{theme=(theme+1)%3;document.documentElement.className=theme===1?'sepia':theme===2?'dark':''};load()})();</script></body></html>

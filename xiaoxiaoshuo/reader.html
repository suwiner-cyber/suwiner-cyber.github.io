<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小小说阅读器</title><style>:root{--bg:#f4f1e8;--paper:#fffdf8;--ink:#26231f;--muted:#777067;--line:#e8e1d6;--accent:#176b55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC","Songti SC","STSong",serif}.bar{position:sticky;top:0;z-index:5;background:rgba(255,253,248,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.bar button,.bar a{border:0;border-radius:10px;padding:9px 13px;background:#eee8dd;color:#2b2823;text-decoration:none;cursor:pointer}.wrap{max-width:920px;margin:auto;padding:26px 18px 80px}.hero,.reader,.toc{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 32px rgba(0,0,0,.04)}.hero{padding:24px;margin-bottom:18px}.hero h1{margin:0 0 10px;font-size:30px}.meta{color:var(--muted);line-height:1.8}.reader{padding:clamp(22px,5vw,60px);min-height:70vh}.chapter-title{text-align:center;margin:0 0 34px;font-size:27px}.content{font-size:20px;line-height:2;letter-spacing:.04em;white-space:pre-wrap}.toc{padding:18px;margin-top:18px;max-height:65vh;overflow:auto}.toc button{width:100%;text-align:left;border:0;border-bottom:1px solid #eee7dc;background:transparent;padding:12px;font-size:15px;cursor:pointer}.toc button.active{color:var(--accent);font-weight:700}.empty{padding:50px 20px;text-align:center;color:var(--muted);line-height:1.8}.empty a{color:var(--accent)}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px}.nav button{flex:1;border:0;border-radius:12px;padding:12px;background:#eee8dd;cursor:pointer}.dark{--bg:#181817;--paper:#242320;--ink:#e9e5dc;--muted:#aaa39a;--line:#383631;--accent:#67b69f}.sepia{--bg:#e8dfcb;--paper:#f5ecd9;--ink:#382f25;--muted:#786b59;--line:#d6c7ad}.status{font-family:system-ui,sans-serif;font-size:13px;color:var(--muted)}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:12px;margin-left:6px}@media(max-width:640px){.wrap{padding:14px 10px 70px}.hero{padding:18px}.reader{padding:24px 18px}.content{font-size:18px}.chapter-title{font-size:23px}}</style></head><body><div class="bar"><a href="./all-catalog.html">← 返回书库</a><button id="tocBtn">目录</button><button id="smaller">A−</button><button id="bigger">A＋</button><button id="theme">护眼</button><button id="retry">重新检查正文</button><span class="status" id="status">正在读取…</span></div><div class="wrap"><section class="hero"><h1 id="bookTitle">小小说阅读器</h1><div class="meta" id="meta"></div></section><section class="reader"><h2 class="chapter-title" id="chapterTitle"></h2><div class="content" id="content"><div class="empty">正在载入书籍和章节…</div></div><div class="nav"><button id="prev">上一章</button><button id="next">下一章</button></div></section><section class="toc" id="toc" hidden></section></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),id=q.get('id'),requested=q.get('base');let book=null,doc={chapters:[]},pos=0,size=20,theme=0,bookBase='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function j(u){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),10000);try{const r=await fetch(u+(u.includes('?')?'&':'?')+'v='+Date.now(),{cache:'no-store',signal:ctl.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}}async function findIn(base){try{const idx=await j('./data/'+base+'/index.json');for(const s of idx.shards||[]){try{const d=await j('./data/'+base+'/'+s.file);const b=(d.books||[]).find(x=>x.id===id);if(b)return b}catch(e){}}}catch(e){}return null}async function findBook(){const order=requested==='v4'?['v4','v5']:requested==='v5'?['v5','v4']:['v5','v4'];for(const b of order){const x=await findIn(b);if(x){bookBase=b;return x}}return null}async function loadChapterDoc(){const paths=['./data/v5/chapters/'+encodeURIComponent(id)+'.json','./data/'+bookBase+'/chapters/'+encodeURIComponent(id)+'.json'];for(const p of paths){try{const d=await j(p);if(Array.isArray(d?.chapters)){return d}}catch(e){}}return {book_id:id,title:book?.title||'',chapters:[],complete:false}}function renderToc(){const ch=doc?.chapters||[];$('toc').innerHTML='<h3>章节目录</h3>'+ch.map((x,i)=>`<button data-i="${i}" class="${i===pos?'active':''}">${esc(x.title||('第'+(x.n||i+1)+'章'))}</button>`).join('');$('toc').querySelectorAll('button').forEach(b=>b.onclick=()=>{pos=+b.dataset.i;show();$('toc').hidden=true})}function show(){const ch=doc?.chapters||[];if(!ch.length){$('chapterTitle').textContent=book?.media==='audio-metadata'?'有声书目录':'正文等待同步';let msg=book?.media==='audio-metadata'?'这本书目前是有声书索引，没有文本章节可供网页版阅读。':'书籍索引已经读取成功，但本地正文文件尚未生成。后台章节镜像完成后，这里会直接显示章节，不会再出现 HTTP 404。';$('content').innerHTML=`<div class="empty"><p>${esc(msg)}</p><p>当前索引：<strong>${esc(bookBase.toUpperCase())}</strong></p>${book?.source_url?`<p><a href="${esc(book.source_url)}" target="_blank" rel="nofollow noopener">查看授权源站详情</a></p>`:''}</div>`;$('prev').disabled=$('next').disabled=true;$('toc').innerHTML='<h3>章节目录</h3><p class="empty">尚无已同步章节。</p>';return}pos=Math.max(0,Math.min(pos,ch.length-1));const c=ch[pos];$('chapterTitle').textContent=c.title||('第'+(c.n||pos+1)+'章');$('content').textContent=c.content||'';$('prev').disabled=pos<=0;$('next').disabled=pos>=ch.length-1;localStorage.setItem('xxs:'+id,String(pos));renderToc();scrollTo({top:0,behavior:'smooth'})}async function load(){if(!id){$('status').textContent='缺少书籍ID';$('content').innerHTML='<div class="empty">请从书库选择一本小说进入阅读。</div>';return}try{$('status').textContent='正在读取书籍索引…';book=await findBook();if(!book)throw new Error('书籍索引暂时不存在，请返回书库刷新');$('bookTitle').textContent=book.title||'未命名';$('meta').innerHTML=[book.author,book.kind,book.status,book.source_name].filter(Boolean).map(esc).join(' · ')+` <span class="badge">${esc(bookBase.toUpperCase())}</span>`;document.title=(book.title||'阅读')+' - 小小说';doc=await loadChapterDoc();const n=doc.chapters?.length||0;$('status').textContent=n?`已同步 ${n} 章${doc.complete?' · 全本':' · 持续同步'}`:'书籍读取成功 · 正文等待同步';pos=+(localStorage.getItem('xxs:'+id)||0);show()}catch(e){$('status').textContent='读取失败';$('chapterTitle').textContent='暂时无法打开';$('content').innerHTML=`<div class="empty"><p>${esc(e?.message||'未知错误')}</p><p><a href="./all-catalog.html">返回书库重新选择</a></p></div>`;$('prev').disabled=$('next').disabled=true}}$('prev').onclick=()=>{if(pos>0){pos--;show()}};$('next').onclick=()=>{if(doc&&pos<(doc.chapters||[]).length-1){pos++;show()}};$('tocBtn').onclick=()=>{$('toc').hidden=!$('toc').hidden};$('retry').onclick=load;$('bigger').onclick=()=>{size=Math.min(30,size+1);$('content').style.fontSize=size+'px'};$('smaller').onclick=()=>{size=Math.max(14,size-1);$('content').style.fontSize=size+'px'};$('theme').onclick=()=>{theme=(theme+1)%3;document.documentElement.className=theme===1?'sepia':theme===2?'dark':'';$('theme').textContent=theme===0?'护眼':theme===1?'夜间':'白天'};load()})();</script></body></html>

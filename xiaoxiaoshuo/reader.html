<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小小说阅读器</title><style>:root{--bg:#f4f1e8;--paper:#fffdf8;--ink:#26231f;--muted:#777067;--line:#e8e1d6;--accent:#176b55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC","Songti SC","STSong",serif}.bar{position:sticky;top:0;z-index:20;background:rgba(255,253,248,.96);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar button,.bar a{border:0;border-radius:10px;padding:9px 13px;background:#eee8dd;color:#2b2823;text-decoration:none}.wrap{max-width:920px;margin:auto;padding:26px 18px 80px}.hero,.reader{background:var(--paper);border:1px solid var(--line);border-radius:22px}.hero{padding:24px;margin-bottom:18px}.reader{padding:clamp(22px,5vw,60px);min-height:70vh}.chapter-title{text-align:center;margin:0 0 34px}.content{font-size:20px;line-height:2;letter-spacing:.04em;white-space:pre-wrap}.nav{display:flex;gap:12px;margin-top:26px}.nav button{flex:1;border:0;border-radius:12px;padding:12px;background:#eee8dd}.empty{padding:46px 18px;text-align:center;color:var(--muted);line-height:1.8}.status{font-family:system-ui,sans-serif;font-size:13px;color:var(--muted)}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:12px}.mask{position:fixed;inset:0;background:#0006;z-index:30;opacity:0;pointer-events:none}.mask.show{opacity:1;pointer-events:auto}.drawer{position:fixed;left:0;top:0;bottom:0;width:min(470px,90vw);background:var(--paper);z-index:31;transform:translateX(-100%);transition:.2s;display:flex;flex-direction:column;box-shadow:18px 0 50px #0003}.drawer.show{transform:none}.drawer-head{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.drawer-list{overflow:auto;padding:8px}.drawer-list button{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px;color:var(--ink)}.drawer-list button.active{background:#eee8dd}.drawer-list .ready{color:var(--accent)}.drawer-list .pending{color:var(--muted)}.drawer-list small{float:right}.dark{--bg:#181817;--paper:#242320;--ink:#e9e5dc;--muted:#aaa39a;--line:#383631;--accent:#67b69f}.sepia{--bg:#e8dfcb;--paper:#f5ecd9;--ink:#382f25;--muted:#786b59;--line:#d6c7ad}@media(max-width:640px){.wrap{padding:14px 10px 70px}.reader{padding:24px 18px}.content{font-size:18px}}</style></head><body><div class="bar"><a href="./all-catalog.html">← 返回书库</a><button id="tocBtn">目录</button><button id="smaller">A−</button><button id="bigger">A＋</button><button id="theme">护眼</button><button id="retry">重新检查正文</button><span class="status" id="status">正在读取…</span></div><div class="mask" id="mask"></div><aside class="drawer" id="drawer"><div class="drawer-head"><div><b>完整章节目录</b><div class="status" id="tocStatus"></div></div><button id="close">×</button></div><div class="drawer-list" id="tocList"></div></aside><main class="wrap"><section class="hero"><h1 id="bookTitle">小小说阅读器</h1><div id="meta" class="status"></div></section><section class="reader"><h2 id="chapterTitle" class="chapter-title"></h2><div id="content" class="content"><div class="empty">正在载入…</div></div><div class="nav"><button id="prev">上一章</button><button id="next">下一章</button></div></section></main><script>(()=>{'use strict';const $=x=>document.getElementById(x),q=new URLSearchParams(location.search),requestedId=q.get('id'),requestedBase=q.get('base');let book,bookBase='v5',activeId=requestedId,doc={chapters:[]},toc={chapters:[]},tocPos=0,size=20,theme=0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function j(u){const r=await fetch(u+(u.includes('?')?'&':'?')+'v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}async function findIn(base){try{const idx=await j('./data/'+base+'/index.json');for(const s of idx.shards||[]){const d=await j('./data/'+base+'/'+s.file);const b=(d.books||[]).find(x=>x.id===requestedId);if(b)return b}}catch(e){}return null}async function loadJson(path){try{return await j(path)}catch(e){return null}}async function chooseData(){const ids=[requestedId,...(book.read_ids||[])].filter((v,i,a)=>v&&a.indexOf(v)===i);let best={id:requestedId,toc:{chapters:[]},doc:{chapters:[]},score:-1};for(const id of ids){const td=await loadJson('./data/v5/toc/'+encodeURIComponent(id)+'.json')||{chapters:[]};const cd=await loadJson('./data/v5/chapters/'+encodeURIComponent(id)+'.json')||{chapters:[]};const score=(td.chapters?.length||0)*100000+(cd.chapters?.length||0);if(score>best.score)best={id,toc:td,doc:cd,score}}activeId=best.id;toc=best.toc;doc=best.doc;if(!(toc.chapters||[]).length)toc={chapters:(doc.chapters||[]).map(x=>({n:x.n,title:x.title,url:x.url}))}}function key(x){return x?.url||('n:'+x?.n)}function contentMap(){const m=new Map();(doc.chapters||[]).forEach(x=>m.set(key(x),x));return m}function renderToc(){const m=contentMap(),rows=toc.chapters||[];$('tocStatus').textContent=`完整目录 ${rows.length} 章 · 已有正文 ${doc.chapters?.length||0} 章`;$('tocList').innerHTML=rows.map((x,i)=>`<button data-i="${i}" class="${i===tocPos?'active ':''}${m.has(key(x))?'ready':'pending'}">${esc(x.title||('第'+(x.n||i+1)+'章'))}<small>${m.has(key(x))?'可阅读':'同步中'}</small></button>`).join('')||'<div class="empty">完整目录正在生成</div>';$('tocList').querySelectorAll('button').forEach(b=>b.onclick=()=>{tocPos=+b.dataset.i;show();closeDrawer()})}function show(){const rows=toc.chapters||[],m=contentMap();if(!rows.length){$('chapterTitle').textContent='目录等待同步';$('content').innerHTML='<div class="empty">后台正在生成完整目录和全本正文。</div>';$('prev').disabled=$('next').disabled=true;return}tocPos=Math.max(0,Math.min(tocPos,rows.length-1));const t=rows[tocPos],c=m.get(key(t));$('chapterTitle').textContent=t.title||('第'+(t.n||tocPos+1)+'章');if(c&&c.content){$('content').textContent=c.content}else{$('content').innerHTML=`<div class="empty">这一章已在完整目录中，但正文仍在后台同步。<br>当前进度：${doc.chapters?.length||0}/${rows.length} 章。点击“重新检查正文”可刷新。</div>`}$('prev').disabled=tocPos===0;$('next').disabled=tocPos===rows.length-1;localStorage.setItem('xxs-toc:'+requestedId,String(tocPos));renderToc();scrollTo({top:0,behavior:'smooth'})}function openDrawer(){$('drawer').classList.add('show');$('mask').classList.add('show');renderToc()}function closeDrawer(){$('drawer').classList.remove('show');$('mask').classList.remove('show')}async function load(){if(!requestedId)return;try{$('status').textContent='正在读取完整目录…';for(const b of (requestedBase==='v4'?['v4','v5']:['v5','v4'])){book=await findIn(b);if(book){bookBase=b;break}}if(!book)throw Error('书籍索引不存在');$('bookTitle').textContent=book.title||'未命名';$('meta').innerHTML=[book.author,book.kind,book.status,book.source_name].filter(Boolean).map(esc).join(' · ')+` <span class="badge">${esc(bookBase.toUpperCase())}</span>`;await chooseData();tocPos=+(localStorage.getItem('xxs-toc:'+requestedId)||0);$('status').textContent=`目录 ${toc.chapters?.length||0} 章 · 正文 ${doc.chapters?.length||0} 章${doc.complete?' · 全本':''}`;show()}catch(e){$('status').textContent='读取失败';$('content').innerHTML=`<div class="empty">${esc(e.message||e)}</div>`}}$('prev').onclick=()=>{if(tocPos>0){tocPos--;show()}};$('next').onclick=()=>{if(tocPos<(toc.chapters||[]).length-1){tocPos++;show()}};$('tocBtn').onclick=openDrawer;$('close').onclick=closeDrawer;$('mask').onclick=closeDrawer;$('retry').onclick=load;$('bigger').onclick=()=>{$('content').style.fontSize=(size=Math.min(30,size+1))+'px'};$('smaller').onclick=()=>{$('content').style.fontSize=(size=Math.max(14,size-1))+'px'};$('theme').onclick=()=>{theme=(theme+1)%3;document.documentElement.className=theme===1?'sepia':theme===2?'dark':''};load()})();</script></body></html>
